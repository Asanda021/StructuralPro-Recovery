name: P43 Estimate & Cost Engine 2.0

on:
  pull_request:
    paths:
      - "core/estimate/estimate_cost_engine_v2.py"
      - "tests/test_p43_estimate_cost_engine_2.py"
      - "docs/P43_ESTIMATE_COST_ENGINE_2.md"
      - ".github/workflows/p43-estimate-cost-engine-2.yml"
  push:
    paths:
      - "core/estimate/estimate_cost_engine_v2.py"
      - "tests/test_p43_estimate_cost_engine_2.py"
      - "docs/P43_ESTIMATE_COST_ENGINE_2.md"
      - ".github/workflows/p43-estimate-cost-engine-2.yml"

jobs:
  p43:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pytest
      - run: python -m pytest -q tests/test_p43_estimate_cost_engine_2.py
