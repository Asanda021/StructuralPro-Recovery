name: P116-P120 Production Acceptance
on:
  push:
    branches: ["phase/p116-p120-production"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        priority: [P116,P117,P118,P119,P120]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_p116_p120_production_acceptance.py
      - run: python -m compileall -q core
  regression:
    runs-on: ubuntu-latest
    needs: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_p106_p110_acceptance.py tests/test_p97_p105_production_completion.py tests/test_p95_golden_suite.py tests/test_p111_p115_production_release.py tests/test_p116_p120_production_acceptance.py

