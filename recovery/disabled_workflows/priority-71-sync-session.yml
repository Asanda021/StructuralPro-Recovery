name: Priority 71 Sync Session Device Binding

on:
  pull_request:
    paths:
      - "core/sync/session.py"
      - "tests/test_priority_71_sync_session.py"
      - ".github/workflows/priority-71-sync-session.yml"
  push:
    paths:
      - "core/sync/session.py"
      - "tests/test_priority_71_sync_session.py"
      - ".github/workflows/priority-71-sync-session.yml"

jobs:
  sync-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install pytest
      - run: python -m compileall -q core tests
      - run: python -m pytest -q tests/test_priority_71_sync_session.py
