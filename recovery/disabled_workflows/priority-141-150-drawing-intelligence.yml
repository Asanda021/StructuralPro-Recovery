name: P141-P150 Drawing Intelligence
on:
  push:
    branches: [phase/p141-p150-drawing-intelligence]
  pull_request:
    branches: [main]
jobs:
  drawing-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: pytest -q tests/test_p141_p150_drawing_intelligence.py
      - run: python -m compileall -q core tests
      - run: pytest -q
