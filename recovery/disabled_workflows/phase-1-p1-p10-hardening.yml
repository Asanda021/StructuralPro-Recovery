name: Phase 1 P1-P10 Hardening

on:
  push:
    branches: ["audit/phase-1-p1-p10-hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  dedicated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_phase1_p1_p10_hardening.py
      - run: python -m compileall -q core

  historical-p1-p10-regression:
    runs-on: ubuntu-latest
    needs: dedicated
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_audit_p1_p6_hardening.py tests/test_p87_technical_office.py tests/test_p88_reporting.py tests/test_p89_collaboration.py tests/test_p90_ai.py

  full-regression:
    runs-on: ubuntu-latest
    needs: dedicated
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
