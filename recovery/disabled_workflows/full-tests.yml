name: StructuralPro full tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pypdf ezdxf openpyxl python-docx reportlab
      - name: Compile source
        run: python -m compileall -q core tests
      - name: Run full suite
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests
