name: P41 BIM IFC 2.0
on:
  pull_request:
    paths: ["core/bim/**","tests/test_p41_bim_ifc_2.py",".github/workflows/p41-bim-ifc-2.yml"]
jobs:
  p41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_p41_bim_ifc_2.py
