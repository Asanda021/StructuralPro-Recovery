name: P64 Windows Cloud Hardening
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  p64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q core tests
      - run: python -m pytest -q tests/test_p64_windows_cloud_hardening.py
