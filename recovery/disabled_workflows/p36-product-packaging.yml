name: P36 Product Packaging

on:
  pull_request:
    paths:
      - "core/platform/product.py"
      - "tests/test_product_packaging.py"
      - "docs/P36_PRODUCT_PACKAGING.md"
      - ".github/workflows/p36-product-packaging.yml"
  push:
    branches: [main]
    paths:
      - "core/platform/product.py"
      - "tests/test_product_packaging.py"
      - "docs/P36_PRODUCT_PACKAGING.md"
      - ".github/workflows/p36-product-packaging.yml"

jobs:
  product-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_product_packaging.py
