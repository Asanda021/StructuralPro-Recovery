name: P57 DWG DXF Validation

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/p57-dwg-dxf-validation"]
  pull_request:
    branches: [main]

jobs:
  cad-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest
      - name: Compile
        run: python -m compileall -q core app tests
      - name: P57 tests
        run: python -m pytest -q tests/test_p57_dwg_dxf_validation.py
      - name: Real DXF and PDF provider tests
        run: python -m pytest -q tests/test_ezdxf_provider_v1.py tests/test_real_pdf_vector_takeoff.py
