name: P601-P610 Local AI + GGUF Production Runtime
on:
  push:
    branches:
      - feat/p601-p610-local-ai-gguf-production-runtime
      - main
  pull_request:
    branches:
      - main
jobs:
  local-ai-gguf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run P601-P610 tests
        run: python -m pytest -q tests/test_p601_p610_local_ai_gguf_runtime.py
