name: P471-480 Engineering AI Copilot

on:
  push:
    branches: ["feat/p471-p480-engineering-ai-copilot"]
  pull_request:
    branches: ["main"]

jobs:
  engineering-ai-copilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p471_p480_engineering_ai_copilot.py
