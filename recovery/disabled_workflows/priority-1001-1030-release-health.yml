name: P1001-P1030 Release Health

on:
  push:
    branches: [main, "feat/p1001-p1030-release-health"]
  pull_request:
    branches: [main]

jobs:
  release-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p1001_p1030_release_health.py
