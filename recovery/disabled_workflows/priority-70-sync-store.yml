name: Priority 70 Sync Store Integrity

on:
  pull_request:
    paths:
      - "core/sync_store.py"
      - "tests/test_priority_70_sync_store.py"
      - ".github/workflows/priority-70-sync-store.yml"
  push:
    paths:
      - "core/sync_store.py"
      - "tests/test_priority_70_sync_store.py"
      - ".github/workflows/priority-70-sync-store.yml"

jobs:
  sync-store-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install pytest
      - run: python -m compileall -q core tests
      - run: python -m pytest -q tests/test_priority_70_sync_store.py
