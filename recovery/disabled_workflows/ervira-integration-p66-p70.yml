name: ERVIRA P66-P75 Customer Operations and Trust Gate
on:
  pull_request:
    paths: ["contracts/ervira/p6*.json","contracts/ervira/p7*.json","tests/test_ervira_integration_p66_p70.py","tests/test_ervira_integration_p71_p75.py",".github/workflows/ervira-integration-p66-p70.yml"]
  push:
    branches: [main]
    paths: ["contracts/ervira/p6*.json","contracts/ervira/p7*.json","tests/test_ervira_integration_p66_p70.py","tests/test_ervira_integration_p71_p75.py",".github/workflows/ervira-integration-p66-p70.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q tests
      - run: python -m pytest -q tests/test_ervira_integration_p66_p70.py tests/test_ervira_integration_p71_p75.py
