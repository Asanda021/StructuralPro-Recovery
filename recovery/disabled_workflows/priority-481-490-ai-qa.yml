name: P481-490 AI QA

on:
  push:
    branches: ["feat/p481-p490-ai-qa"]
  pull_request:
    branches: ["main"]

jobs:
  ai-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p481_p490_ai_qa.py
