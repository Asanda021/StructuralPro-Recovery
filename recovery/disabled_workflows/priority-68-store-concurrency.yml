name: Priority 68 Project Store Concurrency
on:
  push:
    paths:
      - core/projects/store.py
      - tests/test_priority_68_store_concurrency.py
      - core/platform/concurrency.py
      - .github/workflows/priority-68-store-concurrency.yml
  pull_request:
    paths:
      - core/projects/store.py
      - tests/test_priority_68_store_concurrency.py
      - core/platform/concurrency.py
      - .github/workflows/priority-68-store-concurrency.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pytest
      - run: python -m pytest -q tests/test_priority_68_store_concurrency.py
