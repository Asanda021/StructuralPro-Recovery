name: Layer 2 Engineering Product Acceptance

on:
  pull_request:
    paths:
      - "core/engineering/**"
      - "core/standards/**"
      - "core/drawing/**"
      - "core/drawings/**"
      - "core/bim/**"
      - "core/takeoff/**"
      - "core/iran/**"
      - "core/reports/**"
      - "core/revision/**"
      - "core/validation/**"
      - "tests/test_p76_layer1_engineering_foundation.py"
      - "tests/test_p77_standards_engine.py"
      - "tests/test_p78_drawing_intelligence.py"
      - "tests/test_p79_drawing_adapters.py"
      - "tests/test_p80_drawing_geometry.py"
      - "tests/test_p81_measurement_takeoff_integration.py"
      - "tests/test_p82_drawing_boq_traceability.py"
      - "tests/test_p83_construction_quantity_core.py"
      - "tests/test_p84_drawing_takeoff.py"
      - "tests/test_p85_bim.py"
      - "tests/test_p85_bim_pipeline.py"
      - "tests/test_p86_boq_pricing_estimate.py"
      - "tests/test_p87_iran_data.py"
      - "tests/test_p87_technical_office.py"
      - "tests/test_p88_reporting.py"
      - "tests/test_p88_revision.py"
      - "tests/test_p89_collaboration.py"
      - "tests/test_p90_ai.py"
      - "tests/test_p91_clients_platform.py"
      - "tests/test_p92_validation.py"
      - "tests/test_phase3_bim_ifc_3d.py"
      - "tests/test_phase4_boq_estimating.py"
      - "tests/test_phase5_iran_concrete.py"
      - "tests/test_phase6_revision_intelligence.py"
      - "tests/test_phase7_audit_traceability.py"
      - ".github/workflows/layer2-acceptance.yml"
  push:
    branches: ["main"]
    paths:
      - "core/engineering/**"
      - "core/standards/**"
      - "core/drawing/**"
      - "core/drawings/**"
      - "core/bim/**"
      - "core/takeoff/**"
      - "core/iran/**"
      - "core/reports/**"
      - "core/revision/**"
      - "core/validation/**"
      - "tests/test_p7*.py"
      - "tests/test_p8*.py"
      - "tests/test_p9*.py"
      - "tests/test_phase*.py"
      - ".github/workflows/layer2-acceptance.yml"

jobs:
  layer2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q core tests
      - run: >
          python -m pytest -q
          tests/test_p76_layer1_engineering_foundation.py
          tests/test_p77_standards_engine.py
          tests/test_p78_drawing_intelligence.py
          tests/test_p79_drawing_adapters.py
          tests/test_p80_drawing_geometry.py
          tests/test_p81_measurement_takeoff_integration.py
          tests/test_p82_drawing_boq_traceability.py
          tests/test_p83_construction_quantity_core.py
          tests/test_p84_drawing_takeoff.py
          tests/test_p85_bim.py
          tests/test_p85_bim_pipeline.py
          tests/test_p86_boq_pricing_estimate.py
          tests/test_p87_iran_data.py
          tests/test_p87_technical_office.py
          tests/test_p88_reporting.py
          tests/test_p88_revision.py
          tests/test_p89_collaboration.py
          tests/test_p90_ai.py
          tests/test_p91_clients_platform.py
          tests/test_p92_validation.py
          tests/test_phase3_bim_ifc_3d.py
          tests/test_phase4_boq_estimating.py
          tests/test_phase5_iran_concrete.py
          tests/test_phase6_revision_intelligence.py
          tests/test_phase7_audit_traceability.py
      - run: python -m pytest -q tests/test_project_pipeline_e2e.py tests/test_p95_golden_suite.py
