name: P1091-P1120 Final Product Acceptance

on:
  push:
    branches: [main, "feat/p1091-p1120-final-product-acceptance"]
  pull_request:
    branches: [main]

jobs:
  final-product-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p1091_p1120_final_product_acceptance.py
