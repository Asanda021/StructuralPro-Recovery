name: P56 Final Verification

on:
  push:
    branches: [main, "feat/p56-final-verification-real-world-tests"]
  pull_request:
    branches: [main]

jobs:
  final-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest
      - name: Compile source
        run: python -m compileall -q core app tests
      - name: Full regression
        run: python -m pytest -q
      - name: P56 focused verification
        run: python -m pytest -q tests/test_p56_final_verification_real_world.py
