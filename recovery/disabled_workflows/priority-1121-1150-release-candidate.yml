name: P1121-P1150 Release Candidate

on:
  push:
    branches: [main, "feat/p1121-p1150-release-candidate"]
  pull_request:
    branches: [main]

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p1121_p1150_release_candidate.py
