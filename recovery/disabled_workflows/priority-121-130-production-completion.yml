name: P121-P130 Production Completion
on:
  push:
    branches: ["phase/p121-p130-production-completion"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        priority: [P121,P122,P123,P124,P125,P126,P127,P128,P129,P130]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q tests/test_p121_p130_production_completion.py
      - run: python -m compileall -q core
  regression:
    runs-on: ubuntu-latest
    needs: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q tests/test_p116_p120_production_acceptance.py tests/test_p121_p130_production_completion.py
