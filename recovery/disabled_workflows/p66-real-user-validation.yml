name: P66 Real User Validation
on:
  push:
    branches: [main, feat/p66-real-user-validation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q tests/test_p66_real_user_validation_v2.py
