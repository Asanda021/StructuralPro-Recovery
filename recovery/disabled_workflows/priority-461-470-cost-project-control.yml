name: P461-P470 Cost & Project Control
on:
  push:
    paths: ["core/cost_control/project_cost_control_v1.py","tests/test_p461_p470_project_cost_control.py"]
  pull_request:
    paths: ["core/cost_control/project_cost_control_v1.py","tests/test_p461_p470_project_cost_control.py"]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_p461_p470_project_cost_control.py
      - run: python -m compileall -q core tests
