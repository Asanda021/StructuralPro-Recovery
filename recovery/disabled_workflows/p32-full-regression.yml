name: P32 Full Regression
on:
  pull_request:
    branches: [main]
    paths: ["core/platform/p32_full_regression.py","tests/test_p32_full_regression.py","tests/test_priority_32_integration_regression.py","docs/P32_FULL_REGRESSION.md",".github/workflows/p32-full-regression.yml"]
  push:
    branches: [main]
    paths: ["core/platform/p32_full_regression.py","tests/test_p32_full_regression.py","tests/test_priority_32_integration_regression.py","docs/P32_FULL_REGRESSION.md",".github/workflows/p32-full-regression.yml"]
jobs:
  p32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run P32 master regression
        run: pytest -q tests/test_p32_full_regression.py tests/test_priority_32_integration_regression.py
