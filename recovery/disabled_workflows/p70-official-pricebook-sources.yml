name: P70 Official Pricebook Sources
on:
  push:
    branches: [main, feat/p70-official-pricebook-sources]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q tests/test_p70_official_pricebook_sources.py
