name: Priority 65 Autosave Recovery Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  autosave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_priority_65_autosave.py
