name: P46 UX 2.0
on:
  pull_request:
    paths: ["core/ux/**","tests/test_p46_ux_2.py","docs/P46_UX_2.md",".github/workflows/p46-ux-2.yml"]
  workflow_dispatch:
jobs:
  dedicated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_p46_ux_2.py
