name: Phases 2-5 P11-P50 Historical Audit

on:
  push:
    branches: ["audit/phases-2-5-p11-p50"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  evidence-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q tests/test_p11_p50_historical_audit.py
      - run: python -m compileall -q core
