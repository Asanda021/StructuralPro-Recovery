name: P58 Real Price Data Calibration

on:
  push:
    branches: [main, "feat/p58-real-price-data-calibration"]
  pull_request:
    branches: [main]

jobs:
  price-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest
      - name: Compile
        run: python -m compileall -q core app tests
      - name: P58 tests
        run: python -m pytest -q tests/test_p58_real_price_data_calibration.py
