name: P681-P690 Provisioning Readiness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  provisioning-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_p681_p690_provisioning_readiness.py -q
