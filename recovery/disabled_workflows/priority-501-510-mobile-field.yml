name: P501-510 Mobile Field

on:
  push:
    branches: ["feat/p501-p510-mobile-field"]
  pull_request:
    branches: ["main"]

jobs:
  mobile-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p501_p510_mobile_field.py
