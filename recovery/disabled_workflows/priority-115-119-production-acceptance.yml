name: P115-P119 Production Acceptance
# Main-branch verification trigger for the production gate.

on:
  push:
    branches: [main, "phase/p115-p119-production-completion"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q tests/test_p115_p119_production_acceptance.py
      - run: python -m compileall -q core

  regression:
    runs-on: ubuntu-latest
    needs: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest pypdf PyMuPDF openpyxl reportlab python-docx ezdxf
      - run: >
          python -m pytest -q
          tests/test_p115_p119_production_acceptance.py
          tests/test_p110_p114_production_acceptance.py
          tests/test_p106_p110_acceptance.py
          tests/test_p97_p105_production_completion.py
          tests/test_p95_golden_suite.py
          tests/test_p86_boq_pricing_estimate.py
          tests/test_p42_revision_intelligence_2.py
