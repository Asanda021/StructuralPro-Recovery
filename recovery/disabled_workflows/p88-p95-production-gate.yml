name: P88-P95 Production Gate
on:
  pull_request:
  workflow_dispatch:
jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_p88_p95_production_completion.py -q
