name: P111-P115 Production Release Acceptance
on:
  push:
    branches: ["phase/p111-p115-production-release"]
  pull_request:
    branches: ["main"]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        priority: [P111,P112,P113,P114,P115]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_p111_p115_production_release.py
      - run: python -m compileall -q core
  regression:
    runs-on: ubuntu-latest
    needs: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_p106_p110_acceptance.py tests/test_p97_p105_production_completion.py tests/test_p95_golden_suite.py tests/test_p93_deterministic_conflicts.py tests/test_p94_client_contract.py tests/test_p87_iran_data.py tests/test_p88_reporting.py tests/test_p88_revision.py tests/test_priority_22_performance.py tests/test_priority_22_application_performance.py tests/test_priority_43_release_artifact_integrity.py tests/test_priority_48_report_export_audit.py tests/test_priority_53_large_project_performance.py tests/test_p111_p115_production_release.py

