name: P45 Collaboration 2.0
on:
  pull_request:
    paths: ["core/collaboration/**","tests/test_p45_collaboration_2.py","docs/P45_COLLABORATION_2.md",".github/workflows/p45-collaboration-2.yml"]
  workflow_dispatch:
jobs:
  dedicated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_p45_collaboration_2.py
