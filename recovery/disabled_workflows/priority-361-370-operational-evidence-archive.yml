name: P361-P370 Operational Evidence Archive

on:
  push:
    paths:
      - "core/platform/operational_evidence_archive_v1.py"
      - "tests/test_p361_p370_operational_evidence_archive.py"
      - "docs/P361_P370_OPERATIONAL_EVIDENCE_ARCHIVE.md"
      - ".github/workflows/priority-361-370-operational-evidence-archive.yml"
  pull_request:
    paths:
      - "core/platform/operational_evidence_archive_v1.py"
      - "tests/test_p361_p370_operational_evidence_archive.py"
      - "docs/P361_P370_OPERATIONAL_EVIDENCE_ARCHIVE.md"
      - ".github/workflows/priority-361-370-operational-evidence-archive.yml"

jobs:
  operational-evidence-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_p361_p370_operational_evidence_archive.py
      - run: python -m compileall -q core tests
