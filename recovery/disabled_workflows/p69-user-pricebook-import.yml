name: P69 User Pricebook Import
on:
  push:
    branches: [main, feat/p69-user-pricebook-import]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q tests/test_p69_user_pricebook_import.py
