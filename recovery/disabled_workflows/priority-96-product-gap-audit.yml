name: P96 Product Gap Audit
on:
  push:
    branches: ["phase/p96-product-gap-audit"]
  pull_request:
    branches: ["main"]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q tests/test_p96_product_gap_audit.py
