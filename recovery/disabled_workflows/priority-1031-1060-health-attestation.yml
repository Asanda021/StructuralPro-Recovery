name: P1031-P1060 Release Health Attestation

on:
  push:
    branches: [main, "feat/p1031-p1060-health-attestation"]
  pull_request:
    branches: [main]

jobs:
  health-attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p1031_p1060_health_attestation.py
