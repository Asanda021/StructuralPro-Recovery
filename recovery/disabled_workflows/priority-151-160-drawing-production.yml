name: P151-P160 Drawing Production Workflow
on:
  push:
    paths: [core/drawing/**, tests/test_p151_p160_drawing_production.py, docs/P151_P160_DRAWING_PRODUCTION.md, .github/workflows/priority-151-160-drawing-production.yml]
  pull_request:
    paths: [core/drawing/**, tests/test_p151_p160_drawing_production.py, docs/P151_P160_DRAWING_PRODUCTION.md, .github/workflows/priority-151-160-drawing-production.yml]
jobs:
  p151-p160:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest>=8.0
      - run: python -m pytest -q tests/test_p151_p160_drawing_production.py
      - run: python -m pytest -q
