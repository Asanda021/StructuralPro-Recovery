name: P59 Real User Validation
on:
  push:
    branches: [main, "feat/p59-real-user-validation"]
  pull_request:
    branches: [main]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest
      - name: Compile
        run: python -m compileall -q core app tests
      - name: P59 tests
        run: python -m pytest -q tests/test_p59_real_user_validation.py
