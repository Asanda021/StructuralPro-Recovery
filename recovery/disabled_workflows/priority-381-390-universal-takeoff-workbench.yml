name: P381-P390 Universal Takeoff Workbench
on:
  push:
    paths:
      - "core/takeoff_workbench_v1.py"
      - "tests/test_p381_p390_universal_takeoff_workbench.py"
      - "docs/P381_P390_UNIVERSAL_TAKEOFF_WORKBENCH.md"
      - ".github/workflows/priority-381-390-universal-takeoff-workbench.yml"
  pull_request:
    paths:
      - "core/takeoff_workbench_v1.py"
      - "tests/test_p381_p390_universal_takeoff_workbench.py"
      - "docs/P381_P390_UNIVERSAL_TAKEOFF_WORKBENCH.md"
      - ".github/workflows/priority-381-390-universal-takeoff-workbench.yml"
jobs:
  universal-takeoff-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_p381_p390_universal_takeoff_workbench.py
      - run: python -m compileall -q core tests
