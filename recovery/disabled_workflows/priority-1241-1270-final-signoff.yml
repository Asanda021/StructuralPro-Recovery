name: P1241-P1270 Final Sign-off

on:
  push:
    branches: [main, "feat/final-sign-off"]
  pull_request:
    branches: [main]

jobs:
  final-signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p1241_p1270_final_signoff.py
