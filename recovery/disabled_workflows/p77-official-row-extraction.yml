name: P77 official 1404 row extraction
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependencies
        run: pip install openpyxl
      - name: Download official SAMA archive
        run: curl -fL --retry 3 -A "StructuralPro-pricebook-fetch/1.0" "https://sama.mporg.ir/DigitalAsset/DigitalAsset/FehrestBaha1404.rar?Web=1" -o /tmp/FehrestBaha1404.rar
      - name: Extract archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar-free
          mkdir -p /tmp/pb
          unrar-free x /tmp/FehrestBaha1404.rar /tmp/pb/
      - name: Inventory source files
        run: find /tmp/pb -type f -maxdepth 3 -print | sort
