name: P38 AI Takeoff 2.0

on:
  push:
    branches: [main, "feat/p38-*"]
    paths:
      - "core/ai/takeoff_ai_v2.py"
      - "tests/test_p38_ai_takeoff_2.py"
      - ".github/workflows/p38-ai-takeoff-2.yml"
  pull_request:
    paths:
      - "core/ai/takeoff_ai_v2.py"
      - "tests/test_p38_ai_takeoff_2.py"
      - ".github/workflows/p38-ai-takeoff-2.yml"

jobs:
  p38:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run P38 acceptance tests
        run: python -m pytest -q tests/test_p38_ai_takeoff_2.py
