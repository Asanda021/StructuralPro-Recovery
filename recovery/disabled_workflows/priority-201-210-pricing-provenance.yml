name: P201-P210 Pricing Provenance
on:
  push:
    branches: [main]
    paths: ['core/pricing/provenance_v1.py','tests/test_p201_p210_pricing_provenance.py','docs/P201_P210_PRICING_PROVENANCE.md','.github/workflows/priority-201-210-pricing-provenance.yml']
  pull_request:
    paths: ['core/pricing/provenance_v1.py','tests/test_p201_p210_pricing_provenance.py','docs/P201_P210_PRICING_PROVENANCE.md','.github/workflows/priority-201-210-pricing-provenance.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip 'pytest>=8.0' && python -m pip install -r requirements.txt
      - run: python -m compileall -q core tests
      - run: python -m pytest -q tests/test_p201_p210_pricing_provenance.py
      - run: python -m pytest -q
