name: P65 Iranian Price Evidence
on:
  push:
    branches: [main, feat/p65-iranian-price-evidence]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q tests/test_p65_iranian_price_evidence.py
