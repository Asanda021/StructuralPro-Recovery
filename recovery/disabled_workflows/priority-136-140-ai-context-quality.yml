name: P136-P140 AI Context Quality Gate

on:
  push:
    branches: [main, phase/p136-p140-ai-context-quality-gate]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_p136_p140_production.py
      - run: python -m compileall -q core tests

  regression:
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_p136_p140_production.py tests/test_p126_p135_production.py
      - run: python -m compileall -q core tests
