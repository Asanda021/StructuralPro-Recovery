name: P611-P620 Mobile Android Telegram Clients
on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "core/clients/**"
      - "tests/test_p611_p620_mobile_clients.py"
      - "android/**"
      - ".github/workflows/priority-611-620-mobile-clients.yml"
  workflow_dispatch:
    inputs:
      build_approved:
        description: "Owner approval to compile a mobile executable; protected environment is also required"
        required: true
        type: boolean
        default: false
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pytest
      - run: pytest -q tests/test_p611_p620_mobile_clients.py
  android:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'Asanda021' && inputs.build_approved == true && github.repository == 'Asanda021/StructuralPro' && github.ref == 'refs/heads/main' }}
    environment:
      name: binary-build-approval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Require environment-scoped owner authorization before binary build
        shell: bash
        env:
          STRUCTURALPRO_BUILD_PERMIT: ${{ secrets.STRUCTURALPRO_BINARY_BUILD_APPROVAL }}
        run: test -n "$STRUCTURALPRO_BUILD_PERMIT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:assembleDebug
