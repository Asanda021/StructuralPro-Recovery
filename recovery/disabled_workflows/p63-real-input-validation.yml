name: P63 Real Input Validation
on:
  push:
    branches: [main, "feat/p63-real-input-validation"]
  pull_request:
    branches: [main]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest
      - run: python -m compileall -q core app tests
      - run: python -m pytest -q tests/test_p63_real_input_validation.py
