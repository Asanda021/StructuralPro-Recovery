name: P62 E2E Production Readiness
on:
  push:
    branches: [main, "feat/p62-e2e-production-readiness"]
  pull_request:
    branches: [main]
jobs:
  e2e-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest
      - run: python -m compileall -q core app tests
      - run: python -m pytest -q tests/test_p62_e2e_production_readiness.py
