name: P1061-P1090 Production Boundary Validation

on:
  push:
    branches: [main, "feat/p1061-p1090-production-boundary-validation"]
  pull_request:
    branches: [main]

jobs:
  production-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p1061_p1090_production_boundary.py
