name: P351-P360 Operational Evidence Snapshot

on:
  push:
    paths:
      - "core/platform/operational_evidence_snapshot_v1.py"
      - "tests/test_p351_p360_operational_evidence_snapshot.py"
      - "docs/P351_P360_OPERATIONAL_EVIDENCE_SNAPSHOT.md"
      - ".github/workflows/priority-351-360-operational-evidence-snapshot.yml"
  pull_request:
    paths:
      - "core/platform/operational_evidence_snapshot_v1.py"
      - "tests/test_p351_p360_operational_evidence_snapshot.py"
      - "docs/P351_P360_OPERATIONAL_EVIDENCE_SNAPSHOT.md"
      - ".github/workflows/priority-351-360-operational-evidence-snapshot.yml"

jobs:
  operational-evidence-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_p351_p360_operational_evidence_snapshot.py
      - run: python -m compileall -q core tests
