name: P110-P114 Production Acceptance

on:
  push:
    branches: [main, "phase/p110-p114-production-acceptance"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        priority: [P110, P111, P112, P113, P114]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q tests/test_p110_p114_production_acceptance.py
      - run: python -m compileall -q core

  regression:
    runs-on: ubuntu-latest
    needs: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest pypdf PyMuPDF openpyxl reportlab python-docx ezdxf
      - run: >
          python -m pytest -q
          tests/test_p110_p114_production_acceptance.py
          tests/test_p106_p110_acceptance.py
          tests/test_p97_p105_production_completion.py
          tests/test_p95_golden_suite.py
          tests/test_p86_boq_pricing_estimate.py
          tests/test_p42_revision_intelligence_2.py
