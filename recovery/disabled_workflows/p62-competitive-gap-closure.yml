name: P62 Competitive Gap Closure
on:
  push:
    branches: [main, "feat/p62-competitive-gap-closure"]
  pull_request:
    branches: [main]
jobs:
  p62:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip pytest
      - run: python -m compileall -q core tests
      - run: pytest -q tests/test_p62_competitive_gap_closure.py
