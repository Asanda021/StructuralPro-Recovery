name: P941-P970 Production Integrity

on:
  push:
    branches: [main, feat/p941-p970-production-integrity]
  pull_request:
    branches: [main]

jobs:
  production-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p941_p970_production_integrity.py
