name: P581-P590 Revision Intelligence + Change Impact

on:
  push:
    branches:
      - feat/p581-p590-revision-intelligence-impact
      - main
  pull_request:
    branches:
      - main

jobs:
  revision-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run P581-P590 tests
        run: python -m pytest -q tests/test_p581_p590_revision_intelligence.py
