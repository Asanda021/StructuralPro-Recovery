name: P40 Drawing Intelligence 2.0
on:
  pull_request:
    paths: ["core/drawing/**","tests/test_p40_drawing_intelligence_2.py",".github/workflows/p40-drawing-intelligence-2.yml"]
jobs:
  p40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_p40_drawing_intelligence_2.py
