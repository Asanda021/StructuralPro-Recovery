name: P511-520 Integration Ecosystem

on:
  push:
    branches: ["feat/p511-p520-integration-ecosystem"]
  pull_request:
    branches: ["main"]

jobs:
  integration-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p511_p520_integration_ecosystem.py
