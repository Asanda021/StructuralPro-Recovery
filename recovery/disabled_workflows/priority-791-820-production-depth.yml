name: P791-P820 Production Depth Acceptance
on:
  push:
    branches: [main, feat/p791-p820-production-depth]
  pull_request:
    branches: [main]
jobs:
  production-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p791_p820_production_depth.py
