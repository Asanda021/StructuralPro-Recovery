name: StructuralPro Priority 61 Audit Integrity Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-build-policy:
    name: security-build-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static test dependencies only
        run: python -m pip install pytest PyYAML
      - name: Enforce owner-approved binary production contract
        run: |
          python -m pytest -q \
            tests/test_owner_approved_binary_build_workflows.py \
            tests/test_binary_build_security_contract.py \
            tests/test_p37_release_gate_separation.py \
            tests/test_p37_real_product_deployment.py
  audit-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - run: python -m compileall -q core tests
      - run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_priority_61_audit_integrity.py
