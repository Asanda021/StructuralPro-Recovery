name: P1211-P1240 Post-Release Verification

on:
  push:
    branches: [main, "feat/p1211-p1240-post-release-verification"]
  pull_request:
    branches: [main]

jobs:
  post-release-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p1211_p1240_post_release_verification.py
