name: StructuralPro Priority 55 Provisioning Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q core tests
      - name: Install test runner
        run: python -m pip install pytest
      - name: Provisioning evidence tests
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_priority_55_external_provisioning.py
