name: P761-P790 Production Depth Assurance

on:
  push:
    branches: [main, "feat/p761-p790-production-depth"]
  pull_request:
    branches: [main]

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pytest
      - run: python -m pytest tests/test_p761_p790_production_depth.py -q
