name: P104 Cloud Production Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest
      - name: Run collaboration production smoke
        run: |
          python - <<'PY'
          from core.cloud.production_smoke_v1 import smoke_event
          result = smoke_event()
          assert result["accepted"]["accepted"]
          assert result["conflict"]["conflict"]
          assert result["merge"]["requires_review"]
          print("P104 cloud collaboration smoke: PASS")
          PY
      - name: Run cloud-related tests
        run: python -m pytest -q tests -k "cloud or collaboration"
