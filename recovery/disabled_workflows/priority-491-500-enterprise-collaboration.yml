name: P491-500 Enterprise Collaboration

on:
  push:
    branches: ["feat/p491-p500-enterprise-collaboration"]
  pull_request:
    branches: ["main"]

jobs:
  enterprise-collaboration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p491_p500_enterprise_collaboration.py
