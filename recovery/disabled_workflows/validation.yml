name: StructuralPro Validation Gate
on:
  pull_request:
    paths: ["core/validation.py","tests/test_p92_validation.py","core/benchmark/**",".github/workflows/validation.yml"]
  push:
    branches: [main]
    paths: ["core/validation.py","tests/test_p92_validation.py","core/benchmark/**",".github/workflows/validation.yml"]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_p92_validation.py
