name: IFC decoding boundary
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ifc-decoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt ifcopenshell==0.9.0
      - name: Install native Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Verify real IFC parser and malformed input boundary
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_phase22_ifc_bim.py tests/test_ifc_mesh_viewer.py
