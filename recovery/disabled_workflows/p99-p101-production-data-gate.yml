name: P99-P101 Production Data Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  production-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q core tests
      - name: Unit gates
        run: python -m pytest -q tests/test_p99_p101_production_data.py
      - name: Production matrix gate
        if: ${{ hashFiles('data/pricebooks/manifest.json') != '' }}
        run: python -c 'from core.estimate.pricebook_historical_matrix_v1 import load_manifest; print(load_manifest("data/pricebooks/manifest.json"))'
      - name: Production matrix pending
        if: ${{ hashFiles('data/pricebooks/manifest.json') == '' }}
        run: echo "No real 24-cell production matrix committed; data gate is pending by design."
