name: P881-P910 Golden Dataset Acceptance
on:
  push:
    branches: [main, feat/p881-p910-golden-dataset]
  pull_request:
    branches: [main]
jobs:
  golden-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p881_p910_golden_project.py
