name: P52 Market Launch & Continuous Improvement

on:
  pull_request:
    paths:
      - "core/market/**"
      - "tests/test_p52_market_launch_continuous_improvement.py"
      - "docs/P52_MARKET_LAUNCH_CONTINUOUS_IMPROVEMENT.md"
      - ".github/workflows/p52-market-launch-continuous-improvement.yml"
  push:
    branches: [main]
    paths:
      - "core/market/**"
      - "tests/test_p52_market_launch_continuous_improvement.py"
      - "docs/P52_MARKET_LAUNCH_CONTINUOUS_IMPROVEMENT.md"
      - ".github/workflows/p52-market-launch-continuous-improvement.yml"

jobs:
  p52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_p52_market_launch_continuous_improvement.py