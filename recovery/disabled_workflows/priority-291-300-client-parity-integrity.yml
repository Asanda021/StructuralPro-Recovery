name: P291-P300 Client Parity Integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  dedicated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pytest
      - run: pytest -q tests/test_p291_p300_client_parity_integrity.py
      - run: python -m compileall -q core/platform/client_parity_integrity_v1.py
