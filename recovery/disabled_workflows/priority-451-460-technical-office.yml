name: P451-460 Technical Office / دفتر فنی
on:
  push:
    paths: ["core/technical_office/technical_office_v1.py","tests/test_p451_p460_technical_office.py"]
  pull_request:
    paths: ["core/technical_office/technical_office_v1.py","tests/test_p451_p460_technical_office.py"]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_p451_p460_technical_office.py
      - run: python -m compileall -q core tests
