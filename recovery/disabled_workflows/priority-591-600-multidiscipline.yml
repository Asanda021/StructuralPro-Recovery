name: P591-P600 Multi-Discipline Coordination
on:
  push:
    branches: [feat/p591-p600-multidiscipline-coordination-v2, main]
  pull_request:
    branches: [main]
jobs:
  coordination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_p591_p600_multidiscipline.py
