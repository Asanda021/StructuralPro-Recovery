name: P521-530 Unified AEC Project Twin

on:
  push:
    branches: ["feat/p521-p530-unified-aec-project-twin"]
  pull_request:
    branches: ["main"]

jobs:
  project-twin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p521_p530_unified_aec_project_twin.py
