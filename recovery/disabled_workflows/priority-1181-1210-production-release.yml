name: P1181-P1210 Production Release

on:
  push:
    branches: [main, "feat/p1181-p1210-production-release"]
  pull_request:
    branches: [main]

jobs:
  production-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p1181_p1210_production_release.py
