name: P171-P180 BOQ Propagation
on:
  push:
    paths:
      - core/drawing/**
      - tests/test_p171_p180_boq_propagation.py
      - docs/P171_P180_BOQ_PROPAGATION.md
      - .github/workflows/priority-171-180-boq-propagation.yml
  pull_request:
    paths:
      - core/drawing/**
      - tests/test_p171_p180_boq_propagation.py
      - docs/P171_P180_BOQ_PROPAGATION.md
      - .github/workflows/priority-171-180-boq-propagation.yml
jobs:
  p171-p180:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest>=8.0
      - run: python -m pytest -q tests/test_p171_p180_boq_propagation.py
      - run: python -m pytest -q
