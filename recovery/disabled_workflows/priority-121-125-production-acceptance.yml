name: P121-P125 Production Acceptance

on:
  push:
    branches: [main, phase/p121-p125-production]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_p121_p125_production.py
      - run: python -m compileall -q core

  regression:
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_p121_p125_production.py tests/test_p120_bim_ifc_production.py tests/test_p110_p114_production_acceptance.py tests/test_p106_p110_acceptance.py tests/test_p97_p105_production_completion.py tests/test_p95_golden_suite.py tests/test_p86_boq_pricing_estimate.py
      - run: python -m compileall -q core tests

# Production gate intentionally covers dedicated acceptance plus legacy regression.
