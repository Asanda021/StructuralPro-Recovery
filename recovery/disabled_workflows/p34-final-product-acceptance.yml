name: P34 Final Product Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "core/platform/p34_final_product_acceptance.py"
      - "tests/test_p34_final_product_acceptance.py"
      - "docs/P34_FINAL_PRODUCT_ACCEPTANCE.md"
      - ".github/workflows/p34-final-product-acceptance.yml"
      - "docs/PHASE*.md"
      - "tests/test_phase*.py"
      - "tests/test_p*.py"
  push:
    branches: [main]
    paths:
      - "core/platform/p34_final_product_acceptance.py"
      - "tests/test_p34_final_product_acceptance.py"
      - "docs/P34_FINAL_PRODUCT_ACCEPTANCE.md"
      - ".github/workflows/p34-final-product-acceptance.yml"
      - "docs/PHASE*.md"
      - "tests/test_phase*.py"
      - "tests/test_p*.py"
jobs:
  p34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run P34 acceptance gate
        run: pytest -q tests/test_p34_final_product_acceptance.py
      - name: Run P32 regression gate
        run: pytest -q tests/test_p32_full_regression.py
