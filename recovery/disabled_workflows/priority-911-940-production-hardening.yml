name: P911-P940 Production Hardening
on:
  push:
    branches: [main, feat/p911-p940-production-hardening-v3]
  pull_request:
    branches: [main]
jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p911_p940_production_hardening.py
