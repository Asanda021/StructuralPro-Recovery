# P100 production sync is an explicit/manual data-import workflow.
# It is intentionally not a PR/main CI gate because it depends on external archive availability.
name: P100 Pricebook Archive Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p100-pricebook-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'Asanda021' && github.repository == 'Asanda021/StructuralPro' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl
      - name: Download and extract 24 pricebooks
        run: python scripts/sync_pricebooks_24.py
      - name: Remove raw archives from repository payload
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        run: rm -rf data/pricebooks/raw
      - name: Verify 24-cell production matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/pricebooks/manifest.json").read_text(encoding="utf-8"))
          cells=m["cells"]
          assert len(cells)==24, f"expected 24 cells, got {len(cells)}"
          assert all(c["rows"]>0 and c["priced_rows"]>0 and c["sha256"] and c["download_url"] for c in cells)
          assert len({(c["year"],c["discipline"]) for c in cells})==24
          print("24/24 cells verified with priced rows, URLs and SHA-256 provenance")
          PY
      - name: Transfer verified pricebooks to publishing job
        uses: actions/upload-artifact@v4
        with:
          name: p100-verified-pricebooks
          path: data/pricebooks/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sync
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'Asanda021' && github.repository == 'Asanda021/StructuralPro' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Retrieve verified pricebooks
        uses: actions/download-artifact@v4
        with:
          name: p100-verified-pricebooks
          path: data/pricebooks/
      - name: Validate downloaded publication payload
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          base = Path('data/pricebooks')
          manifest = base / 'manifest.json'
          m = json.loads(manifest.read_text(encoding='utf-8'))
          cells = m['cells']
          assert len(cells) == 24
          assert len({(c['year'], c['discipline']) for c in cells}) == 24
          assert all(c['rows'] > 0 and c['priced_rows'] > 0 and c['sha256'] and c['download_url'] for c in cells)
          assert not any(p.is_symlink() for p in base.rglob('*'))
          PYCODE
      - name: Publish imported pricebooks on automation branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pricebooks
          if git diff --cached --quiet; then
            echo "No pricebook changes to publish."
            exit 0
          fi
          branch="automation/p100-pricebook-sync-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "data: sync 24 Iranian building pricebooks"
          token_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $token_header" push --set-upstream origin "$branch"
          unset token_header

          echo "Creating/updating the data publication PR..."
          api="${GITHUB_API_URL:-https://api.github.com}"
          prs=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$branch&base=main")
          count=$(printf "%s" "$prs" | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$count" -eq 0 ]; then
            payload=$(python -c 'import json,sys; print(json.dumps({"title":"P100 — Publish 24 real Iranian pricebooks","head":sys.argv[1],"base":"main","body":"Automated publication of the verified P100 1399–1404 × 4-discipline real pricebook dataset. Includes normalized rows, manifest, SHA-256 provenance and priced-row coverage. Direct pushes to main are blocked by repository rules, so this PR is the publication boundary."}))' "$branch")
            curl -fsSL -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "$api/repos/${GITHUB_REPOSITORY}/pulls" -d "$payload"
          else
            echo "An open publication PR already exists for $branch."
          fi

