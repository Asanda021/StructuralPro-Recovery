name: P97-P102 Production Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_p97_p102_production_block.py -q
