name: P971-P1000 Release Assurance

on:
  push:
    branches: [main, feat/p971-p1000-release-assurance]
  pull_request:
    branches: [main]

jobs:
  release-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p971_p1000_release_assurance.py
