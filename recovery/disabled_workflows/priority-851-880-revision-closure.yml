name: P851-P880 Revision Closure
on:
  push:
    branches: [main, feat/p851-p880-revision-closure]
  pull_request:
    branches: [main]
jobs:
  revision-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p851_p880_revision_closure.py
