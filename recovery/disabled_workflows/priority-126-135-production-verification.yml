name: P126-P135 Production Verification
on:
  push:
    branches: ["main", "phase/p126-p135-production-verification"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        priority: [P126,P127,P128,P129,P130,P131,P132,P133,P134,P135]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: python -m compileall -q core tests
      - run: python -m pytest -q tests/test_p126_p135_production.py tests/test_p121_p130_production_completion.py tests/test_p131_p140_production_closure.py
  regression:
    runs-on: ubuntu-latest
    needs: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q tests/test_p126_p135_production.py tests/test_p116_p120_production_acceptance.py tests/test_p121_p130_production_completion.py tests/test_p131_p140_production_closure.py
