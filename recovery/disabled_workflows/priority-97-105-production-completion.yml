name: P97-P105 Production Completion
on:
  push:
    branches: ["phase/p97-p105-production-completion"]
  pull_request:
    branches: ["main"]
jobs:
  production:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        priority: [P97,P98,P99,P100,P101,P102,P103,P104,P105]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q tests/test_p97_p105_production_completion.py
      - run: python -m compileall -q core
  full-production:
    runs-on: ubuntu-latest
    needs: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pip pytest pypdf PyMuPDF openpyxl reportlab python-docx ezdxf
      - run: python -m pytest -q tests/test_p76_layer1_engineering_foundation.py tests/test_p77_standards_engine.py tests/test_p78_drawing_intelligence.py tests/test_p79_drawing_adapters.py tests/test_p80_drawing_geometry.py tests/test_p81_measurement_takeoff_integration.py tests/test_p82_drawing_boq_traceability.py tests/test_p83_construction_quantity_core.py tests/test_p84_drawing_takeoff.py tests/test_p85_bim.py tests/test_p85_bim_pipeline.py tests/test_p86_boq_pricing_estimate.py tests/test_p87_iran_data.py tests/test_p87_technical_office.py tests/test_p88_reporting.py tests/test_p88_revision.py tests/test_p89_collaboration.py tests/test_p90_ai.py tests/test_p91_clients_platform.py tests/test_p92_validation.py tests/test_p93_deterministic_conflicts.py tests/test_p94_client_contract.py tests/test_p95_golden_suite.py tests/test_p97_p105_production_completion.py
