name: P541-550 Native DWG DXF Production Boundary

on:
  push:
    branches:
      - feat/p541-p550-native-dwg-dxf-production-boundary
  pull_request:
    branches:
      - main

jobs:
  p541-p550-cad-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run P541-P550 tests
        run: python -m pytest -q tests/test_p541_p550_native_dwg_dxf_production_boundary.py
