name: P631-P640 Professional RTL Reports
on:
  push:
    branches: ["**"]
  pull_request:
    paths: ["core/reports/**","tests/test_p631_p640_rtl_reports.py",".github/workflows/priority-631-640-rtl-reports.yml"]
jobs:
  report-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -U pytest
      - run: pytest -q tests/test_p631_p640_rtl_reports.py
