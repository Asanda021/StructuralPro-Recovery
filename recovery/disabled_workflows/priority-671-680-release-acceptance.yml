name: P671-P680 Final Release Acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  release-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_p671_p680_release_acceptance.py -q
