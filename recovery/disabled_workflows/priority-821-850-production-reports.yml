name: P821-P850 Production Reports
on:
  push:
    branches: [main, feat/p821-p850-production-reports]
  pull_request:
    branches: [main]
jobs:
  production-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p821_p850_production_reports.py
