name: Priority 62 Backup Contract Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_priority_62_backup_contract.py
