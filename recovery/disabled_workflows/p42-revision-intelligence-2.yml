name: P42 Revision Intelligence 2.0

on:
  pull_request:
    paths:
      - "core/revision/intelligence_v2.py"
      - "tests/test_p42_revision_intelligence_2.py"
      - "docs/P42_REVISION_INTELLIGENCE_2.md"
      - ".github/workflows/p42-revision-intelligence-2.yml"
  push:
    paths:
      - "core/revision/intelligence_v2.py"
      - "tests/test_p42_revision_intelligence_2.py"
      - "docs/P42_REVISION_INTELLIGENCE_2.md"
      - ".github/workflows/p42-revision-intelligence-2.yml"

jobs:
  p42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pytest
      - run: python -m pytest -q tests/test_p42_revision_intelligence_2.py
