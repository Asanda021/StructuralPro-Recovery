name: P531-540 BIM IFC Interoperability

on:
  push:
    branches: ["feat/p531-p540-bim-ifc-interoperability"]
  pull_request:
    branches: ["main"]

jobs:
  bim-ifc-interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_p531_p540_bim_ifc_interoperability.py
