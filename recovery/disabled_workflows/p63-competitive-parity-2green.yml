name: P63 Competitive Parity 2-Green

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  p63:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile
        run: python -m compileall -q core tests
      - name: Tests
        run: python -m pytest -q tests/test_p63_competitive_parity_2green.py
