name: P141-P150 Global Cost Intelligence

on:
  push:
    branches: [main, phase/p141-p150-global-cost-intelligence]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_p141_p150_production.py
      - run: python -m compileall -q core tests
  regression:
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_p141_p150_production.py tests/test_p136_p140_production.py tests/test_p126_p135_production.py
      - run: python -m compileall -q core tests
