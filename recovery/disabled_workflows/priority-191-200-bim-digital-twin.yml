name: P191-P200 BIM Digital Twin

on:
  push:
    branches: [main]
    paths:
      - 'core/bim/digital_twin_v1.py'
      - 'tests/test_p191_p200_bim_digital_twin.py'
      - 'docs/P191_P200_BIM_DIGITAL_TWIN.md'
      - '.github/workflows/priority-191-200-bim-digital-twin.yml'
  pull_request:
    paths:
      - 'core/bim/digital_twin_v1.py'
      - 'tests/test_p191_p200_bim_digital_twin.py'
      - 'docs/P191_P200_BIM_DIGITAL_TWIN.md'
      - '.github/workflows/priority-191-200-bim-digital-twin.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-runtime
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip 'pytest>=8.0'
      - name: Compile
        run: python -m compileall -q core tests
      - name: Dedicated P191-P200 tests
        run: python -m pytest -q tests/test_p191_p200_bim_digital_twin.py
      - name: Full regression
        run: python -m pip install -r requirements.txt && python -m pytest -q
