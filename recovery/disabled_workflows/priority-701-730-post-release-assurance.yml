name: P701-P730 Post-Release Assurance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  post-release-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_p701_p730_post_release_assurance.py -q
