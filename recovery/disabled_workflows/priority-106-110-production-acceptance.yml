name: P106-P110 Production Acceptance
on:
  push:
    branches: ["main", "phase/p106-p110-production-acceptance"]
  pull_request:
    branches: ["main"]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        priority: [P106,P107,P108,P109,P110]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest pypdf PyMuPDF openpyxl reportlab python-docx ezdxf
      - run: python -m pytest -q tests/test_p106_p110_acceptance.py
      - run: python -m compileall -q core
  regression:
    runs-on: ubuntu-latest
    needs: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest pypdf PyMuPDF openpyxl reportlab python-docx ezdxf
      - run: python -m pytest -q tests/test_p76_layer1_engineering_foundation.py tests/test_p77_standards_engine.py tests/test_p78_drawing_intelligence.py tests/test_p79_drawing_adapters.py tests/test_p80_drawing_geometry.py tests/test_p81_measurement_takeoff_integration.py tests/test_p82_drawing_boq_traceability.py tests/test_p83_construction_quantity_core.py tests/test_p84_drawing_takeoff.py tests/test_p85_bim.py tests/test_p85_bim_pipeline.py tests/test_p86_boq_pricing_estimate.py tests/test_p87_iran_data.py tests/test_p87_technical_office.py tests/test_p88_reporting.py tests/test_p88_revision.py tests/test_p89_collaboration.py tests/test_p90_ai.py tests/test_p91_clients_platform.py tests/test_p92_validation.py tests/test_p93_deterministic_conflicts.py tests/test_p94_client_contract.py tests/test_p95_golden_suite.py tests/test_p97_p105_production_completion.py tests/test_p106_p110_acceptance.py
