name: P431-440 Unified 2D + BIM Multi-Discipline Takeoff
on:
  push:
    paths: ["core/takeoff/unified_2d_bim_takeoff_v1.py","tests/test_p431_p440_unified_2d_bim_takeoff.py"]
  pull_request:
    paths: ["core/takeoff/unified_2d_bim_takeoff_v1.py","tests/test_p431_p440_unified_2d_bim_takeoff.py"]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_p431_p440_unified_2d_bim_takeoff.py
      - run: python -m compileall -q core tests
