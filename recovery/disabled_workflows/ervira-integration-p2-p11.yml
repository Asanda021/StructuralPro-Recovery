name: StructuralPro ERVIRA integration parity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_ervira_integration_p2_p11.py
