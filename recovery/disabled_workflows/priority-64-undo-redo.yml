name: Priority 64 Undo Redo Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_priority_64_undo_redo.py
