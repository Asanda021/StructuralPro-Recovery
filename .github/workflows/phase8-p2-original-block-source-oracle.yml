name: P8 P2 original BLOCK source oracle (synthetic only)
on:
  push:
    branches: [fix/phase8-p2-offline-converter-veto-20261104]
    paths:
      - core/drawings/dwg_original_block_source_oracle.py
      - tools/audit_phase8_p2_original_block_source.py
      - tests/test_phase8_p2_original_block_source_oracle.py
      - .github/workflows/phase8-p2-original-block-source-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-synthetic-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Synthetic-only original-DWG block roster regression
        run: |
          python -m pip install -q pytest==9.0.2
          python -m pytest -q tests/test_phase8_p2_original_block_source_oracle.py
