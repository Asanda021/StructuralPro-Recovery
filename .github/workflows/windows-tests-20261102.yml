# Test-only run on Windows. No build, installer or release steps.
# Trigger: push to this branch only (ci/windows-tests-20261102).
name: windows-tests-20261102

on:
  push:
    branches:
      - ci/windows-tests-20261102

permissions:
  contents: read

jobs:
  pytest-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run pytest (offscreen Qt)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q --tb=short -p no:cacheprovider 2>&1 | Tee-Object -FilePath pytest-output.txt
        continue-on-error: true
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
