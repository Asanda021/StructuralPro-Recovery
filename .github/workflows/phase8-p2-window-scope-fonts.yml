name: P8 P2 real Qt Window Zoom scoped CAD and bilingual text gate
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - core/drawings/viewport_tools.py
      - core/drawings/native_dwg_preview.py
      - core/cad/persian_text_v1.py
      - core/drawings/dwg_takeoff.py
      - core/drawings/cad_import_worker.py
      - app/graphical_takeoff.py
      - tests/test_phase8_p2_window_scope_fonts.py
      - .github/workflows/phase8-p2-window-scope-fonts.yml
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - core/drawings/viewport_tools.py
      - app/graphical_takeoff.py
      - core/drawings/native_dwg_preview.py
      - tests/test_phase8_p2_window_scope_fonts.py
      - .github/workflows/phase8-p2-window-scope-fonts.yml
permissions:
  contents: read
concurrency:
  group: p8p2-window-scope-fonts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qt-window-and-font-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt offscreen runtime libraries
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install Windows product dependencies with pinned ready-made DWG reader
        run: python -m pip install -q -r requirements.txt
      - name: Qt drag rectangle and scoped quantity policy
        run: python -m pytest -q tests/test_phase8_p2_window_scope_fonts.py tests/test_viewport_tools.py tests/test_persian_cad_text_v1.py --junitxml=p8p2-window-scope-junit.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-window-scope-font-test-${{ matrix.os }}
          path: p8p2-window-scope-junit.xml
          if-no-files-found: warn
          retention-days: 14
