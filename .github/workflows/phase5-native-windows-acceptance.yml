name: Phase 5 native Windows authorization and UI acceptance
on:
  push:
    branches:
      - feature/phase5-priorities1-3-data-safety-20261025
    paths:
      - .github/workflows/phase5-native-windows-acceptance.yml
      - tests/test_phase5_windows_native_acceptance.py
      - core/platform/identity.py
      - core/projects/store.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-p5-security:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact phase 5 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install essential Windows UI and test dependencies
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt
      - name: Windows OS and token, real user and PySide6
        shell: pwsh
        run: |
          python -c "import platform, sqlite3, sys; from PySide6 import QtCore; print(platform.platform(), sys.version, sqlite3.sqlite_version, QtCore.__version__)"
      - name: Native SID and project authorization and PySide6 UI
        shell: pwsh
        run: |
          python -m pytest -q --maxfail=1 --junitxml=p5-windows-native.xml tests/test_phase5_windows_native_acceptance.py tests/test_phase5_p3_trusted_identity_store.py tests/test_phase5_p3_ui_authorization.py tests/test_phase4_sqlite_windows_native.py
      - name: Upload JUnit for owner review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p5-windows-native-junit
          path: p5-windows-native.xml
          if-no-files-found: warn
          retention-days: 14
