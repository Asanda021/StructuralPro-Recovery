name: P6 G2 measure independently published IFC4 geometry and memory
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-g2-independent-capacity-measure.yml
      - scripts/diagnostics/p6_independent_ifc_geometry_capacity.py
      - tests/test_phase6_g2_geometry_capacity_measurement.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-capacity-measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 19
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONFAULTHANDLER: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: .
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:core/bim/ifc.py)" = "8f99bdf2fc06d503eff021ec0937bbf040a391a9"
          test "$(git rev-parse HEAD:core/drawings/bim_adapter.py)" = "48462b5e3689b2158f9565372d93a3603b15cea0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install independent IFC parser and diagnostics runtime
        run: python -m pip install -q "ifcopenshell>=0.8" "psutil>=5.9,<8" pytest
      - name: Check strict syntax
        run: python -m py_compile scripts/diagnostics/p6_independent_ifc_geometry_capacity.py tests/test_phase6_g2_geometry_capacity_measurement.py
      - name: Test isolated measurement oracle and hash guard
        run: python -m pytest -q tests/test_phase6_g2_geometry_capacity_measurement.py
      - name: Inspect pinned published IFC4 models with bounded memory and time
        run: python scripts/diagnostics/p6_independent_ifc_geometry_capacity.py --output p6-capacity-evidence
      - name: Preserve sanitized aggregate evidence, including incomplete results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-ifc-capacity-${{ matrix.os }}
          path: p6-capacity-evidence/summary.json
          if-no-files-found: warn
          retention-days: 14
