name: P6 E6 history preview stable CAS Qt Windows and Linux
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-p5-e6-history-cas.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-cas-qt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 19
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - name: Preserve exact bytes on Windows
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aae52eb52292886295591e584b96a66dcb54881f
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "aae52eb52292886295591e584b96a66dcb54881f"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native Linux Qt prerequisites
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install original test dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Execute actual Qt SQLite E6 and ownership tests
        run: |
          python scripts/run_phase6_pytest.py 1000 -q --junitxml=p6-e6-cas-${{ matrix.qpa }}.xml tests/test_e6_history_preview_cas.py tests/test_phase6_p5_e6_live_context.py tests/test_phase6_p5_e6_ifc_transfer_history.py
      - name: Preserve JUnit even when real RED fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-e6-history-cas-${{ matrix.qpa }}
          path: p6-e6-cas-${{ matrix.qpa }}.xml
          retention-days: 14
          if-no-files-found: warn
