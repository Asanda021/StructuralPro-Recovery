name: P6 E4 callback contract GREEN Windows and Linux
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-e4-callback-green.yml
      - tests/test_e4_callback_contract.py
      - app/project_search_panel.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-e4-callback-green-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e4-callback-qt-green:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONUTF8: '1'
      PYTHONPATH: .
    steps:
      - name: Preserve original bytes on Windows
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 426c485f16c4938299a9c0415e96dd5ff15d1c1b
          persist-credentials: false
      - name: Verify exact accepted source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "426c485f16c4938299a9c0415e96dd5ff15d1c1b"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux native Qt prerequisites
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install original requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Validate callback contracts and existing E4 real Qt navigation
        run: |
          python -m compileall -q app/project_search_panel.py
          python scripts/run_phase6_pytest.py 780 -q --junitxml=p6-e4-callback-green-${{ matrix.qpa }}.xml tests/test_e4_callback_contract.py tests/test_phase6_p5_e4_snapshot_race.py tests/test_phase6_p5_e4_search.py tests/test_phase6_p5_e4_ui.py tests/test_phase6_p5_e4_sessions.py
      - name: Preserve real JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-e4-callback-green-${{ matrix.qpa }}
          path: p6-e4-callback-green-${{ matrix.qpa }}.xml
          retention-days: 14
          if-no-files-found: warn
