name: Phase 6 source-backed multi-discipline IFC4 spatial-context acceptance
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-multidiscipline-ifc4-acceptance.yml
      - tests/test_phase6_multidiscipline_ifc4_geometry.py
      - core/bim/ifc.py
      - app/ifc_3d_viewport.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ifc-multidiscipline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install original runtime and IFC adapter
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Compile modified and tested modules
        run: python -m compileall -q core/bim/ifc.py app/ifc_3d_viewport.py tests/test_phase6_multidiscipline_ifc4_geometry.py
      - name: Execute actual IFC4 and real Qt viewer acceptance
        run: >
          python -m pytest -q --maxfail=1 -o faulthandler_timeout=0
          --junitxml=p6-ifc-multidiscipline.xml
          tests/test_phase6_multidiscipline_ifc4_geometry.py
          tests/test_phase6_p2_real_ifc_3d.py
          tests/test_phase6_p2_visibility_pick.py
          tests/test_phase6_p2_background_loader.py
          tests/test_phase6_p2_member_batches.py
          tests/test_phase6_p2_benchmark_ifc100.py
          tests/test_phase6_p2_e2_restore.py
          tests/test_phase6_p3_four_view_final.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-multidiscipline-${{ matrix.os }}
          path: p6-ifc-multidiscipline.xml
          if-no-files-found: warn
          retention-days: 14
