name: Phase 6 P3 final source-backed 2D 3D Tree BOQ acceptance
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-p3-final-four-view-acceptance.yml
      - tests/test_phase6_p3_four_view_final.py
      - app/verified_selection_panel.py
      - app/graphical_takeoff.py
      - app/ifc_3d_viewport.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-four-view:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONFAULTHANDLER: '1'
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard exact source commit and persisted product oracle
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:tests/test_manual_formula_fivefloor_closure.py)" = "f81c979051bcbaaf00015fa411314e28f370b291"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install IFC and Qt runtime
        run: python -m pip install -q -r requirements.txt 'ifcopenshell>=0.8'
      - name: Compile modified runtime and new four-view regressions
        run: python -m compileall -q app/verified_selection_panel.py app/graphical_takeoff.py app/ifc_3d_viewport.py tests/test_phase6_p3_four_view_final.py
      - name: Native Qt 2D 3D tree BOQ cross-view and fail-closed acceptance
        run: python -m pytest -q --disable-warnings -o faulthandler_timeout=0 --maxfail=1 --junitxml=phase6-p3-final.xml tests/test_phase6_p3_verified_selection.py tests/test_phase6_p3_selection_panel.py tests/test_phase6_p3_real_project_bridge.py tests/test_phase6_p3_full_verified_boq.py tests/test_phase6_p3_real_qt_four_view.py tests/test_phase6_p3_four_view_final.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-p3-final-four-view-${{ matrix.os }}
          path: phase6-p3-final.xml
          retention-days: 14
          if-no-files-found: warn
