name: P7 priority5 E8 source discrepancy preflight native QA
on:
  push:
    branches:
      - feature/phase7-p5-e8-source-discrepancy-20261031
    paths:
      - core/reports/source_discrepancy_gate.py
      - core/reports/ifc_crosswalk_source_audit.py
      - tests/test_phase7_p5_ifc_boq_commit_gate.py
      - core/platform/application.py
      - tests/test_phase7_p5_source_discrepancy_gate.py
      - tests/test_phase7_p5_ifc_crosswalk_source_audit.py
      - tests/test_phase7_p5_real_commit_integration.py
      - .github/workflows/phase7-p5-source-discrepancy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-discrepancy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Compile E8 and source-backed original engines
        run: >-
          python -m py_compile
          core/reports/source_discrepancy_gate.py
          core/reports/ifc_crosswalk_source_audit.py
          core/platform/application.py
          core/reports/custom_batch.py
          core/reports/technical_office_revision.py
      - name: Persisted PDF, SHA, BOQ and source clash acceptance
        run: >-
          python -m pytest -q
          --junitxml=p7-p5-e8-targeted.xml
          tests/test_phase7_p5_source_discrepancy_gate.py
          tests/test_phase7_p5_ifc_crosswalk_source_audit.py
          tests/test_phase7_p5_ifc_boq_commit_gate.py
          tests/test_phase2_priority5_closure.py
          tests/test_phase7_p5_real_commit_integration.py
          tests/test_ai_takeoff_persistent_approval.py
          tests/test_phase2_advanced_geometry_sqlite.py
          tests/test_phase7_p2_persisted_boq_crosswalk.py
          tests/test_phase7_p4_technical_office_revision.py
          tests/test_phase7_p4_approved_price_impact.py
          tests/test_drawing_duplicate_detection.py
          tests/test_phase6_p3_verified_selection.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p7-p5-e8-junit-${{ matrix.os }}
          path: p7-p5-e8-targeted.xml
          retention-days: 14
          if-no-files-found: warn
