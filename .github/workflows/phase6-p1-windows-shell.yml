name: Phase 6 P1 Windows RTL glass shell functional acceptance
on:
  push:
    branches:
      - feature/phase6-p1-desktop-shell-20261026
    paths:
      - .github/workflows/phase6-p1-windows-shell.yml
      - app/main.py
      - app/desktop_shell.py
      - app/desktop_preferences.py
      - app/theme.py
      - tests/test_phase6_p1_shell.py
      - tests/test_phase6_p1_font_diagnostics.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-qt-p6-p1:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
      STRUCTURALPRO_P6_SCREENSHOT_DIR: phase6-p1-evidence/linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install desktop Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
          python -m pip install -q -r requirements.txt 'ifcopenshell>=0.8'
      - name: Compile and test real shell and navigation
        run: |
          python -m compileall -q app/main.py app/desktop_shell.py app/desktop_preferences.py
          python scripts/run_offline_tests.py -q --junitxml=phase6-p1-linux.xml \
            tests/test_phase6_p1_shell.py \
            tests/test_master13_desktop_shell_runtime.py \
            tests/test_windows_ui_navigation_dashboard.py
      - name: Store JUnit and real desktop captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-p1-linux-qt-evidence
          path: |
            phase6-p1-linux.xml
            phase6-p1-evidence/linux/
          if-no-files-found: warn
          retention-days: 14
  windows-qt-p6-p1:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      STRUCTURALPRO_P6_SCREENSHOT_DIR: phase6-p1-evidence/windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Windows GUI dependencies
        shell: pwsh
        run: python -m pip install -q -r requirements.txt
      - name: Real Windows Qt RTL ribbon theme and calendar
        shell: pwsh
        run: |
          python -m compileall -q app/main.py app/desktop_shell.py app/desktop_preferences.py
          python -m pytest -q --maxfail=1 --junitxml=phase6-p1-windows.xml tests/test_phase6_p1_shell.py tests/test_master13_desktop_shell_runtime.py tests/test_windows_ui_navigation_dashboard.py
      - name: Diagnose native Windows font rasterization
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          STRUCTURALPRO_P6_FONT_DIR: phase6-p1-evidence/windows-font
        run: |
          python -m pytest -q -s --maxfail=1 --junitxml=phase6-p1-windows-font.xml tests/test_phase6_p1_font_diagnostics.py
      - name: Store Windows Qt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-p1-windows-qt-evidence
          path: |
            phase6-p1-windows.xml
            phase6-p1-windows-font.xml
            phase6-p1-evidence/windows-font/
            phase6-p1-evidence/windows/
          if-no-files-found: warn
          retention-days: 14
