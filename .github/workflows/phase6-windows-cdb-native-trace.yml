name: P6 native CDB second chance crash-site diagnostic without dumps
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-windows-cdb-native-trace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-cdb-two-real-oracles:
    runs-on: windows-2022
    timeout-minutes: 34
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: windows
      PYTHONPATH: .
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject changed product or original five-floor oracle
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:core/takeoff/manual_formula_register.py)" = "4e3750a0e797073d40bacb395e448da4f14b6c56"
          test "$(git rev-parse HEAD:app/manual_formula_controls.py)" = "07e8ce4567eec5122253cd220a49fed6e2e27d9e"
          test "$(git rev-parse HEAD:app/manual_takeoff.py)" = "12828195669dc2586cc3d5300e0781cf93183135"
          test "$(git rev-parse HEAD:core/projects/store.py)" = "0aa448bcc0f67bab12c37592f7abf01fd0e1765d"
          test "$(git rev-parse HEAD:tests/test_manual_formula_fivefloor_closure.py)" = "f81c979051bcbaaf00015fa411314e28f370b291"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify trusted Microsoft CDB is available without downloading binaries
        shell: pwsh
        run: |
          $debugger = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (!(Test-Path $debugger)) { throw 'CDB_NOT_INSTALLED: diagnostic blocked, not passed' }
          $item = Get-Item $debugger
          if ($item.VersionInfo.CompanyName -notmatch 'Microsoft') { throw 'Unrecognized native debugger vendor' }
          Add-Content -Path $env:GITHUB_ENV -Value "CDB_PATH=$debugger"
          Write-Host "Microsoft CDB available; no dump creation requested"
      - name: Install identical original test dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Test sanitization and code compilation before native debugging
        run: |
          python -m py_compile scripts/diagnostics/p6_native_cdb_trace.py
          python scripts/diagnostics/p6_native_cdb_trace.py --self-check
      - name: Capture installed Qt Python SQLite DLL digests without private paths
        run: python scripts/inspect_windows_native_environment.py --output cdb-evidence/environment.json
      - name: Debug unchanged full five-floor integrated Qt acceptance in two fresh processes
        continue-on-error: true
        run: python scripts/diagnostics/p6_native_cdb_trace.py --arm integrated --repeats 2 --timeout 420 --output cdb-evidence/integrated
      - name: Debug native real Qt 70-row review and commit in two fresh processes
        continue-on-error: true
        run: python scripts/diagnostics/p6_native_cdb_trace.py --arm dialog_commit --repeats 2 --timeout 420 --output cdb-evidence/dialog_commit
      - name: Gate on every valid native-oracle JUnit never masking access violation
        if: always()
        shell: pwsh
        run: |
          $passed = $true
          foreach ($arm in @('integrated','dialog_commit')) {
            $p = "cdb-evidence/$arm/summary.json"
            if (!(Test-Path $p)) { Write-Host "$arm missing summary: RED"; $passed = $false; continue }
            $d = Get-Content -Raw -Encoding UTF8 $p | ConvertFrom-Json
            Write-Host "$arm status=$($d.status) root-proven=$($d.native_root_cause_proven)"
            foreach ($r in $d.attempts) {
              Write-Host "$arm attempt=$($r.attempt) junit=$($r.junit.passed) valid=$($r.valid_test_pass) native_av=$($r.second_chance_marker) stack=$($r.native_stack_available) wall=$($r.wall_seconds)"
            }
            if (!$d.all_valid -or $d.attempts.Count -ne 2) { $passed = $false }
          }
          if (!$passed) { throw 'NATIVE_CDB_EVIDENCE_RED_OR_INCOMPLETE' }
      - name: Upload only sanitized live exception-site summaries and original JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-live-native-cdb-exception-no-dumps
          path: cdb-evidence/
          if-no-files-found: warn
          retention-days: 14
