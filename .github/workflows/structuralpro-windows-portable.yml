name: StructuralPro Windows portable preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/structuralpro-windows-portable.yml
      - scripts/build_structuralpro_windows_portable.ps1
      - app/column_takeoff_desktop.py
      - app/column_takeoff_portable_smoke.py
      - app/pdf_column_takeoff_panel.py
      - core/drawings/pdf_column_*.py
      - tests/test_phase8_p2_a_column_*.py
      - requirements.txt
      - VERSION

permissions:
  contents: read

jobs:
  windows-portable:
    name: Package and exercise the portable Windows desktop
    if: >-
      github.repository == 'Asanda021/StructuralPro-Recovery' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.number == 49 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'fix/phase8-p2-a-pdf-takeoff-20261115') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/fix/phase8-p2-a-pdf-takeoff-20261115'))
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify checkout and install build dependencies
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -ne $env:SOURCE_SHA) { throw "Checkout is not the requested source SHA" }
          python -m pip install -r requirements.txt 'pytest==8.4.2' 'pyinstaller==6.19.0'
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
      - name: Synthetic column calculation and native Qt tests
        shell: pwsh
        run: >-
          python -m pytest -q tests/test_phase8_p2_a_column_length_schedule.py
          tests/test_phase8_p2_a_column_weight_preview.py tests/test_phase8_p2_a_column_takeoff_qt.py
      - name: Build, extract and run the exact portable ZIP
        shell: pwsh
        run: |
          try {
            & ./scripts/build_structuralpro_windows_portable.ps1 `
              -OutputDirectory (Join-Path $env:RUNNER_TEMP 'structuralpro-portable-delivery') `
              -ExpectedSourceSha $env:SOURCE_SHA
          } catch {
            $message = "$($_.Exception.Message) $($_.ScriptStackTrace)"
            $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows portable build::$escaped"
            throw
          }
      - name: Upload tested ZIP and verification records
        id: portable-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: StructuralPro-Windows-Portable
          path: |
            ${{ runner.temp }}/structuralpro-portable-delivery/StructuralPro-Windows-Portable.zip
            ${{ runner.temp }}/structuralpro-portable-delivery/StructuralPro-Windows-Portable.zip.sha256.txt
            ${{ runner.temp }}/structuralpro-portable-delivery/portable-build.json
            ${{ runner.temp }}/structuralpro-portable-delivery/portable-smoke.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish the portable download link
        shell: pwsh
        env:
          PORTABLE_ARTIFACT_URL: ${{ steps.portable-artifact.outputs.artifact-url }}
        run: |
          if (-not $env:PORTABLE_ARTIFACT_URL) { throw "Portable artifact upload did not return a download URL" }
          Write-Host "::notice title=Download the tested Windows portable ZIP::$env:PORTABLE_ARTIFACT_URL"
          "[Download the tested Windows portable ZIP and SHA-256](${env:PORTABLE_ARTIFACT_URL})" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
