name: Phase 4 SQLite parent-path identity

on:
  push:
    branches:
      - feature/phase4-priorities4-6-site-operations-20261024
    paths:
      - .github/workflows/phase4-sqlite-parent-path.yml
      - tests/test_phase4_sqlite_parent_directory_safety.py
      - core/projects/store.py

permissions:
  contents: read

jobs:
  parent-directory-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python and pytest
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q "pytest>=8,<10"
      - name: Run ONLY parent-directory SQLite identity regression
        run: python -m pytest -q tests/test_phase4_sqlite_parent_directory_safety.py --junitxml=phase4-parent-identity.xml
      - name: Save results of red and green runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase4-parent-identity-test
          path: phase4-parent-identity.xml
          if-no-files-found: warn
          retention-days: 14
