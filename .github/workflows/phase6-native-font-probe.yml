name: P6 investigate actual Windows font glyph coverage and rendered shell
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-native-font-probe.yml]
permissions:
  contents: read
jobs:
  font-proof:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: windows
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Probe font database and styled application font without changing product
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,sys,tempfile
          from PySide6.QtWidgets import QApplication,QMainWindow,QLabel
          from PySide6.QtGui import QFont,QRawFont,QFontDatabase,QFontInfo,QTextLayout
          from PySide6.QtCore import QTimer
          from app.desktop_preferences import _preferred_persian_font,_supports_mixed_script
          root=Path('font-evidence');root.mkdir()
          text='StructuralPro 0123456789 ۰۱۲۳۴۵۶۷۸۹ کارگاه متره'
          result={'source_sha':__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip()}
          def probe(font):
              raw=QRawFont.fromFont(font)
              return {'requested_family':font.family(),'resolved_family':QFontInfo(font).family(),'raw_family':raw.familyName(),'raw_valid':raw.isValid(),'missing':sum(not raw.supportsCharacter(ord(c)) for c in text if c!=' '),'zero_glyphs':sum(i==0 for i in raw.glyphIndexesForString(text))}
          with tempfile.TemporaryDirectory() as temp:
              Path.home=classmethod(lambda cls:Path(temp))
              from app.main import main
              def inspect(app):
                  family,supported=_preferred_persian_font()
                  result.update(chosen=family,verified=supported,family_count=len(QFontDatabase.families()),candidates={n:probe(QFont(n,16)) for n in ('Tahoma','Segoe UI','Arial',family)})
                  win=next(x for x in app.topLevelWidgets() if isinstance(x,QMainWindow))
                  app.processEvents()
                  brand=win.findChild(QLabel,'BrandTitle')
                  result['application_properties']={'family':app.property('structuralproFontFamily'),'arabic':app.property('structuralproFontArabicSupported')}
                  result['app_font']=probe(app.font());result['brand_font']=probe(brand.font())
                  result['brand_text_matches']=brand.text()=='StructuralPro'
                  win.grab().save(str(root/'shell.png'))
                  (root/'font-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
                  QTimer.singleShot(0,app.quit)
              real=QApplication.exec
              def test_exec(app):
                  QTimer.singleShot(150,lambda:inspect(app))
                  return real(app)
              QApplication.exec=test_exec
              main()
          print(json.dumps(result,ensure_ascii=False))
          assert result['verified'] and result['app_font']['zero_glyphs']==0 and result['brand_font']['zero_glyphs']==0,'MISSING_ACTUAL_GLYPHS'
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-native-font-diagnostic
          path: font-evidence/
          retention-days: 14
