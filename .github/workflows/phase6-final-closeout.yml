# Dedicated, source-SHA-pinned broad regression. No build, release or merge.
name: P6 final closeout source-pinned complete active regression
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-final-closeout.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-final-closeout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current-suite-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - name: Checkout latest workflow-triggering code and all tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert source SHA before broad QA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'Requested source SHA: %s\nActual source SHA: %s\n' '${{ github.sha }}' "$actual"
          test "$actual" = '${{ github.sha }}'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install repository test requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Execute all non-archived current modules, preserve real JUnit and quarantine
        run: |
          python scripts/run_quarantined_workflow_qa.py --mode current --timeout 1200 --json phase6-broad-current.json --log phase6-broad-current.log --junit phase6-broad-current.xml
      - name: Report exact outcome without changing exit status
        if: always()
        shell: bash
        run: |
          python -c 'import json,pathlib; p=pathlib.Path("phase6-broad-current.json"); d=json.loads(p.read_text()) if p.is_file() else {"error":"No runner JSON was produced"}; print("::notice title=Broad current actual result::" + json.dumps({"source_sha":"${{ github.sha }}","pytest_exit_code":d.get("pytest_exit_code"),"timed_out":d.get("timed_out"),"overall_green":d.get("overall_green"),"stats":{k:v for k,v in (d.get("stats") or {}).items() if k in ("collected","passed","failed","skipped","error","failures")}},ensure_ascii=False)[:9000])'
      - name: Surface actual broad failure log for diagnosis
        if: always()
        shell: bash
        run: |
          python -c 'import json,pathlib; j=pathlib.Path("phase6-broad-current.json"); p=pathlib.Path("phase6-broad-current.log"); d=json.loads(j.read_text(encoding="utf-8")) if j.is_file() else {}; t=p.read_text(encoding="utf-8",errors="replace")[-3500:] if p.is_file() else "No actual pytest log was produced"; print("::notice title=Broad failure diagnostic::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A")) if d.get("overall_green") is not True else None'
      - name: Preserve original current-suite logs, JSON and JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-broad-current-linux
          path: |
            phase6-broad-current.json
            phase6-broad-current.log
            phase6-broad-current.xml
          retention-days: 14
          if-no-files-found: warn

  current-suite-windows:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: windows-2022
    timeout-minutes: 38
    env:
      QT_QPA_PLATFORM: windows
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - name: Preserve unchanged workflow quarantine bytes on native Windows
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact current branch head and tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert pinned current source SHA before broad Windows QA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'Requested source SHA: %s\\nActual source SHA: %s\\n' '${{ github.sha }}' "$actual"
          test "$actual" = '${{ github.sha }}'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original Windows test requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Execute disjoint current-module shard from zero-active-workflow source
        run: |
          python scripts/run_quarantined_workflow_qa.py --mode current --shard-count 3 --shard-index ${{ matrix.shard }} --timeout 1500 --json phase6-broad-current-windows.json --log phase6-broad-current-windows.log --junit phase6-broad-current-windows.xml
      - name: Report actual Windows summary without masking failures
        if: always()
        shell: bash
        run: |
          python -c 'import json,pathlib; p=pathlib.Path("phase6-broad-current-windows.json"); d=json.loads(p.read_text()) if p.is_file() else {"error":"No runner JSON was produced"}; print("::notice title=Broad current actual result::" + json.dumps({"source_sha":"${{ github.sha }}","pytest_exit_code":d.get("pytest_exit_code"),"timed_out":d.get("timed_out"),"overall_green":d.get("overall_green"),"stats":{k:v for k,v in (d.get("stats") or {}).items() if k in ("collected","passed","failed","skipped","error","failures")}},ensure_ascii=False)[:9000])'
      - name: Surface actual broad failure log for diagnosis
        if: always()
        shell: bash
        run: |
          python -c 'import json,pathlib; j=pathlib.Path("phase6-broad-current-windows.json"); p=pathlib.Path("phase6-broad-current-windows.log"); d=json.loads(j.read_text(encoding="utf-8")) if j.is_file() else {}; t=p.read_text(encoding="utf-8",errors="replace")[-3500:] if p.is_file() else "No actual pytest log was produced"; print("::notice title=Broad failure diagnostic::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A")) if d.get("overall_green") is not True else None'
      - name: Preserve original native Windows JUnit logs and JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-broad-current-windows-${{ matrix.shard }}
          path: |
            phase6-broad-current-windows.json
            phase6-broad-current-windows.log
            phase6-broad-current-windows.xml
          retention-days: 14
          if-no-files-found: warn


  verify-full-union:
    # Even when a shard fails, inspect whichever original JUnit artifacts exist.
    # Missing artifact/JUnit must FAIL instead of quietly skipping this gate.
    needs: [current-suite-linux, current-suite-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current HEAD shard validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download real Linux and all Windows JUnit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p6-broad-current-*
          path: shards
          merge-multiple: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate partition guards then compare complete JUnit union
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_phase6_broad_shard_manifest.py tests/test_phase6_broad_shard_coverage.py
          python scripts/verify_phase6_broad_shards.py --root shards --shard-count 3 --output broad-union-verified.json
      - name: Inspect original downloaded JUnit JSON and logs
        run: |
          python - <<'PY_EVIDENCE'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as ET
          for folder in sorted(Path("shards").iterdir()):
              if not folder.is_dir():
                  continue
              result = {"artifact": folder.name, "source_sha": "${{ github.sha }}", "files": []}
              for path in sorted(folder.iterdir()):
                  raw = path.read_bytes()
                  file = {"name": path.name, "sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)}
                  if path.suffix == ".xml":
                      cases = list(ET.fromstring(raw).iter("testcase"))
                      file.update(tests=len(cases), failed=sum(c.find("failure") is not None for c in cases), errors=sum(c.find("error") is not None for c in cases), skipped=sum(c.find("skipped") is not None for c in cases))
                      file["skip_reasons"] = sorted({c.find("skipped").get("message", "") for c in cases if c.find("skipped") is not None})
                  elif path.suffix == ".json":
                      data = json.loads(raw)
                      file.update({k: data.get(k) for k in ("pytest_exit_code", "timed_out", "junit_report_written", "overall_green", "current_test_modules_total", "current_test_modules_in_shard")})
                  elif path.suffix == ".log":
                      file["tail"] = raw.decode("utf-8", errors="replace")[-650:]
                  result["files"].append(file)
              Path("inspected-" + folder.name + ".json").write_text(json.dumps(result, indent=2), encoding="utf-8")
              print("::notice title=Original broad artifact inspection::" + json.dumps(result, ensure_ascii=False))
          PY_EVIDENCE
      - name: Preserve exact union verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-broad-shard-union-verification
          path: |
            broad-union-verified.json
            inspected-p6-broad-current-*.json
          retention-days: 14
          if-no-files-found: warn

  phase6-functional-and-persistence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
            kind: linux
          - os: windows-2022
            qpa: windows
            kind: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 27
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      STRUCTURALPRO_P6_SCREENSHOT_DIR: phase6-final-screenshots
      STRUCTURALPRO_E5_SCREENSHOTS: phase6-final-e5-screenshots
    steps:
      - name: Prevent Windows auto-conversion of tracked originals
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard exact source and unchanged original high-stress test
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:tests/test_manual_formula_fivefloor_closure.py)" = "f81c979051bcbaaf00015fa411314e28f370b291"
          test "$(git rev-parse HEAD:core/takeoff/manual_formula_register.py)" = "4e3750a0e797073d40bacb395e448da4f14b6c56"
          test "$(git rev-parse HEAD:app/manual_formula_controls.py)" = "07e8ce4567eec5122253cd220a49fed6e2e27d9e"
          test "$(git rev-parse HEAD:core/projects/store.py)" = "0aa448bcc0f67bab12c37592f7abf01fd0e1765d"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt renderer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install unchanged Windows/Linux application test requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Compile current GUI, session, persistence and evidence gate
        run: python -m compileall -q app/graphical_takeoff.py app/verified_selection_panel.py app/ifc_3d_viewport.py app/workspace_docks.py core/drawings/project_selection_bridge.py core/projects/store.py scripts/diagnostics/p6_phase6_final_acceptance_gate.py
      - name: Real UI P1 P2 P3 E2 and native 2D 3D Tree BOQ dock acceptance
        continue-on-error: true
        run: >
          python -m pytest -q --maxfail=1 -o faulthandler_timeout=0
          --junitxml=p6-final-views.xml
          tests/test_phase6_p1_shell.py
          tests/test_phase6_p2_source_mesh3d.py
          tests/test_phase6_p2_real_ifc_3d.py
          tests/test_phase6_p2_e2_restore.py
          tests/test_phase6_p3_four_view_final.py
          tests/test_phase6_p3_full_verified_boq.py
          tests/test_phase6_p3_real_project_bridge.py
          tests/test_phase6_p5_e5_docks.py
      - name: P4 P5 operation workflows and saved source-backed histories
        continue-on-error: true
        run: >
          python -m pytest -q --maxfail=1 -o faulthandler_timeout=0
          --junitxml=p6-final-operations.xml
          tests/test_phase6_p4_contextual_takeoff.py
          tests/test_phase6_p4_model_isolation.py
          tests/test_phase6_p5_e3_templates.py
          tests/test_phase6_p5_e3_ui.py
          tests/test_phase6_p5_e4_sessions.py
          tests/test_phase6_p5_e4_snapshot_race.py
          tests/test_phase6_p5_e6_ifc_transfer_history.py
          tests/test_phase6_p5_e6_live_context.py
      - name: Real SQLite restore, backup, fail-closed recovery and PDF XLSX DOCX CSV
        continue-on-error: true
        run: >
          python -m pytest -q --maxfail=1 -o faulthandler_timeout=0
          --junitxml=p6-final-persistence.xml
          tests/test_phase5_backup_recovery.py
          tests/test_phase4_sqlite_open_integrity.py
          tests/test_phase4_sqlite_rescue.py
          tests/test_phase1_manual_report_formats.py
          tests/test_manual_formula_reports.py
          tests/test_recovery_office_export_contract.py
      - name: Native Windows SQLite open file-lock and reopen semantics
        if: runner.os == 'Windows'
        continue-on-error: true
        run: >
          python -m pytest -q --maxfail=1 -o faulthandler_timeout=0
          --junitxml=p6-final-win-db.xml
          tests/test_phase4_sqlite_windows_native.py
      - name: Native Windows Qt 150-percent high DPI shell and dock
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          QT_SCALE_FACTOR: '1.5'
        run: >
          python -m pytest -q --maxfail=1 -o faulthandler_timeout=0
          --junitxml=p6-final-win-dpi150.xml
          tests/test_phase6_p5_e5_docks.py
          tests/test_phase6_p1_shell.py
      - name: Native Windows Qt 200-percent high DPI shell and dock
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          QT_SCALE_FACTOR: '2'
        run: >
          python -m pytest -q --maxfail=1 -o faulthandler_timeout=0
          --junitxml=p6-final-win-dpi200.xml
          tests/test_phase6_p5_e5_docks.py
          tests/test_phase6_p1_shell.py
      - name: Fail closed on ANY missing, skipped, failed or invalid required JUnit
        if: always()
        run: python scripts/diagnostics/p6_phase6_final_acceptance_gate.py --platform ${{ matrix.kind }} --output p6-final-acceptance-${{ matrix.kind }}.json
      - name: Preserve verifiable original JUnits and exact source SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-final-acceptance-${{ matrix.os }}
          path: |
            p6-final-*.xml
            p6-final-acceptance-*.json
            phase6-final-screenshots/
            phase6-final-e5-screenshots/
          if-no-files-found: warn
          retention-days: 14

  source-engineering-audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Unit integration and negative geometry guards plus single Windows edition
        run: >-
          python -m pytest -q --junitxml=p6-closeout/targeted.xml
          tests/test_phase6_ifc_build_axes_contract.py tests/test_phase6_g2_axis_orthogonality.py
          tests/test_phase6_g2_integrated_batch_switch.py tests/test_phase6_p2_member_batches.py
          tests/test_phase5_unified_packaging.py tests/test_phase5_a1_unified_release.py
          tests/test_product_packaging.py tests/test_product_editions_runtime.py
      - name: All source SAN v1 and v2 placements numerical and original engineering validator
        run: python scripts/diagnostics/p6_sanitary_build_axes_audit.py --output p6-closeout
      - name: Three pinned published sources through original Qt file picker QProcess 2D and 3D worker
        run: python scripts/diagnostics/p6_g2_heating_sanitary_original_ui.py --output p6-closeout/sanitary-heating-gui
      - name: Historical release contracts in disposable static fixture only
        run: python scripts/run_quarantined_workflow_qa.py --mode historical --timeout 300 --json p6-closeout/historical.json --log p6-closeout/historical.log --junit p6-closeout/historical.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-closeout-engineering-${{ matrix.os }}
          path: p6-closeout/
          retention-days: 14
          if-no-files-found: error
