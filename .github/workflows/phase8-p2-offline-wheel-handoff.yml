name: P8 P2 pinned public DWG wheel (no user documents)
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - .github/workflows/phase8-p2-offline-wheel-handoff.yml
permissions:
  contents: read
concurrency:
  group: p8p2-public-wheel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-prebuilt-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch public PyPI wheel without building anything
        run: python -m pip download --no-deps --only-binary=:all: "ezdwg==0.17.0" -d wheel
      - name: Require known exact public wheel checksum
        run: echo "8239d8170264ae1612bcee06561ecdc53621c5017d979eaaf35d899dd12de44d  wheel/ezdwg-0.17.0-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" | sha256sum --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-public-ezdwg-wheel-linux-x86-64
          path: wheel/*.whl
          if-no-files-found: error
          retention-days: 3
