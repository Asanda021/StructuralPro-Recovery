name: P8 P2 Windows native Qt shell and DPI smoke (synthetic only)

on:
  push:
    branches:
      - fix/phase8-p2-offline-converter-veto-20261104
    paths:
      - tests/phase8_p2_windows_native_ui_probe.py
      - app/main.py
      - app/dashboard.py
      - app/theme.py
      - app/desktop_preferences.py
      - app/ifc_3d_viewport.py
      - app/graphical_takeoff.py
      - tests/test_phase6_p2_real_ifc_3d.py
      - tests/test_phase6_p1_font_diagnostics.py
      - .github/workflows/phase8-p2-windows-native-ui.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8p2-windows-native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-shell:
    name: Windows Qt native visible UI (Qt scale ${{ matrix.scale }})
    runs-on: windows-2022
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - scale: "1"
            slug: "100"
          - scale: "1.5"
            slug: "150"
    env:
      PYTHONPATH: .
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - name: Preserve source file hashes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install existing offline test dependencies (no Autodesk)
        run: python -m pip install -q -r requirements.txt
      - name: Confirm exact commit and Windows runner
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ github.sha }}") { throw "SOURCE_SHA_MISMATCH" }
          if ($env:QT_QPA_PLATFORM -ne "windows") { throw "NOT_NATIVE_WINDOWS_QT" }
          python -c "import platform; print(platform.system(), platform.release()); assert platform.system() == 'Windows'"
      - name: Launch real visible shell, click eight dashboard actions, inspect RTL and capture synthetic UI
        shell: pwsh
        run: |
          python tests/phase8_p2_windows_native_ui_probe.py --evidence "native-ui-evidence/${{ matrix.slug }}"
          if ($LASTEXITCODE -ne 0) { throw "NATIVE_WINDOWS_UI_PROBE_FAILED" }
      - name: Verify report does not grant CAD/financial acceptance
        shell: pwsh
        run: |
          $receipt = Get-Content -Raw -Encoding UTF8 "native-ui-evidence/${{ matrix.slug }}/evidence.json" | ConvertFrom-Json
          if ($receipt.native_qpa -ne "windows" -or $receipt.main_window_exposed -ne $true) { throw "NOT_NATIVE_VISIBLE_UI" }
          if ($receipt.dashboard_actions_clicked.Count -ne 8 -or $receipt.navigation_tabs_checked -ne 23) { throw "INCOMPLETE_UI_INTERACTION" }
          if ($receipt.real_user_desktop_acceptance -ne $false -or $receipt.original_private_dwg_tested -ne $false -or $receipt.geometry_approved_for_financial_takeoff -ne $false -or $receipt.financial_quantity_rows_approved -ne 0) { throw "UI_EVIDENCE_MISREPRESENTED_AS_DWG_APPROVAL" }
          $images = @(Get-ChildItem "native-ui-evidence/${{ matrix.slug }}" -Filter "empty-shell-*.png")
          if ($images.Count -ne 3) { throw "MISSING_QT_RENDER_SCREENSHOTS" }
      - name: Store only isolated synthetic UI screenshots and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-native-windows-ui-scale-${{ matrix.slug }}
          path: |
            native-ui-evidence/${{ matrix.slug }}/evidence.json
            native-ui-evidence/${{ matrix.slug }}/empty-shell-*.png
          if-no-files-found: warn
          retention-days: 14

  native-ifc-font:
    name: Windows native IFC 3D and mixed Persian glyph render
    runs-on: windows-2022
    timeout-minutes: 28
    env:
      PYTHONPATH: .
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: "1.5"
      STRUCTURALPRO_P6_P2_SCREENSHOT_DIR: native-ifc-font-evidence/ifc3d
      STRUCTURALPRO_P6_FONT_DIR: native-ifc-font-evidence/fonts
    steps:
      - name: Preserve source hashes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned reader and IFC native runtime
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Preflight real Windows Qt/IFC dependencies and exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ github.sha }}") { throw "SOURCE_SHA_MISMATCH" }
          python -c "import sys,ifcopenshell,PySide6; print('IFC_PYSIDE6_READY',sys.platform,ifcopenshell.version); assert sys.platform=='win32'"
          if ($LASTEXITCODE -ne 0) { throw "NATIVE_IFC_DEPENDENCY_UNAVAILABLE" }
      - name: Render synthetic IFC 3D canvas with native Windows Qt
        shell: pwsh
        run: |
          python -m pytest -q -o faulthandler_timeout=0 --maxfail=1 --junitxml=native-ifc-font-evidence/ifc3d.xml tests/test_phase6_p2_real_ifc_3d.py::test_real_qt_ifc_3d_button_opens_document_and_syncs_selection
          if ($LASTEXITCODE -ne 0) { throw "NATIVE_IFC_3D_RENDER_FAILED" }
      - name: Check actual rasterized Persian/Latin mixed-script Qt glyphs
        shell: pwsh
        run: |
          python -m pytest -q -o faulthandler_timeout=0 --maxfail=1 --junitxml=native-ifc-font-evidence/fonts.xml tests/test_phase6_p1_font_diagnostics.py::test_qt_glyph_capability_and_render_diagnostics
          if ($LASTEXITCODE -ne 0) { throw "NATIVE_PERSIAN_FONT_RASTER_FAILED" }
      - name: Validate no skipped tests, native images and read-only scope
        shell: pwsh
        run: |
          python -c "import xml.etree.ElementTree as E; paths=['native-ifc-font-evidence/ifc3d.xml','native-ifc-font-evidence/fonts.xml']; roots=[E.parse(x).getroot() for x in paths]; suites=[r if r.tag=='testsuite' else r.find('testsuite') for r in roots]; assert all(y is not None and int(y.get('tests','0'))==1 and int(y.get('failures','0'))==0 and int(y.get('errors','0'))==0 and int(y.get('skipped','0'))==0 for y in suites), [(r.tag,r.attrib) for r in roots]"
          if ($LASTEXITCODE -ne 0) { throw "SKIPPED_OR_FAILED_NATIVE_GUI_TEST" }
          foreach ($path in @('native-ifc-font-evidence/ifc3d/ifc-3d-native-windows.png', 'native-ifc-font-evidence/ifc3d/ifc-3d-dialog-native-windows.png', 'native-ifc-font-evidence/fonts/font-direct.png', 'native-ifc-font-evidence/fonts/font-label.png')) {
            if (!(Test-Path $path)) { throw "MISSING_NATIVE_QT_EVIDENCE: $path" }
            if ((Get-Item $path).Length -lt 1000) { throw "EMPTY_NATIVE_QT_EVIDENCE: $path" }
          }
      - name: Upload synthetic, source-safe native IFC and mixed-font visuals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-native-windows-ifc3d-persian-font
          path: |
            native-ifc-font-evidence/*.xml
            native-ifc-font-evidence/ifc3d/*.png
            native-ifc-font-evidence/fonts/*.png
          retention-days: 14
          if-no-files-found: warn
