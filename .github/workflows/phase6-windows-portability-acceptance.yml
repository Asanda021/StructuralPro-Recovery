name: P6 native Windows portability regression
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-windows-portability-acceptance.yml
      - tests/test_phase2_priority4_closure.py
      - tests/test_phase4_sqlite_dbmoved_safety.py
      - tests/test_phase4_sqlite_open_integrity.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-native-portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-os-safety:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - name: Keep original archived bytes on Windows
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 48a85f5d7ae4a88fe8f092a7e0c27be792bf9b9d
          persist-credentials: false
      - name: Assert exact source SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "48a85f5d7ae4a88fe8f092a7e0c27be792bf9b9d"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install supported test dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Execute actual GUI, database and coverage tests
        run: |
          python scripts/run_phase6_pytest.py 1050 -q --maxfail=1 --junitxml=p6-native-portability-${{ matrix.qpa }}.xml tests/test_phase2_priority4_closure.py::test_async_responsiveness_and_oracle tests/test_phase4_sqlite_dbmoved_safety.py tests/test_phase4_sqlite_open_integrity.py tests/test_phase6_broad_shard_manifest.py tests/test_phase6_broad_shard_coverage.py
      - name: Upload real JUnit and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-native-portability-${{ matrix.qpa }}
          path: p6-native-portability-${{ matrix.qpa }}.xml
          if-no-files-found: warn
          retention-days: 14
