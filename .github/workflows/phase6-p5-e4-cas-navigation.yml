name: P6 E4 stale-navigation CAS Windows and Linux
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-p5-e4-cas-navigation.yml
      - app/project_search_panel.py
      - tests/test_phase6_p5_e4_snapshot_race.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-e4-cas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e4-original-qt-navigation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - name: Preserve original checkout bytes on Windows
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c10b9291cb443431287d656fcf00c4b26e71e196
          persist-credentials: false
      - name: Assert pinned implementation SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "c10b9291cb443431287d656fcf00c4b26e71e196"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt Linux libraries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install project test requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Validate actual Qt search, stale record, IFC and stored sessions
        run: |
          python -m compileall -q app/project_search_panel.py core/search/global_search.py app/verified_search_navigation.py
          python scripts/run_phase6_pytest.py 780 -q --maxfail=1 --junitxml=p6-e4-cas-${{ matrix.qpa }}.xml tests/test_phase6_p5_e4_snapshot_race.py tests/test_phase6_p5_e4_search.py tests/test_phase6_p5_e4_ui.py tests/test_phase6_p5_e4_sessions.py
      - name: Preserve actual JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-e4-cas-${{ matrix.qpa }}
          path: p6-e4-cas-${{ matrix.qpa }}.xml
          if-no-files-found: warn
          retention-days: 14
