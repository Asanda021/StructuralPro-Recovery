# Dedicated, source-SHA-pinned broad regression. No build, release or merge.
name: P6 current broad regression on verified source
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-broad-current-recheck.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-broad-recheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current-suite-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - name: Checkout the exact newly verified E4 code and tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3e5986217f6c4d55756bd9f93d67d9dd4957208
          persist-credentials: false
      - name: Assert source SHA before broad QA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'Requested source SHA: %s\nActual source SHA: %s\n' 'c3e5986217f6c4d55756bd9f93d67d9dd4957208' "$actual"
          test "$actual" = 'c3e5986217f6c4d55756bd9f93d67d9dd4957208'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install repository test requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Execute full current suite with preserved real JUnit and quarantine
        run: |
          python scripts/run_quarantined_workflow_qa.py --mode current --timeout 1200 --json phase6-broad-current.json --log phase6-broad-current.log --junit phase6-broad-current.xml
      - name: Report exact outcome without changing exit status
        if: always()
        shell: bash
        run: |
          python -c 'import json,pathlib; p=pathlib.Path("phase6-broad-current.json"); d=json.loads(p.read_text()) if p.is_file() else {"error":"No runner JSON was produced"}; print(json.dumps({"source_sha":"c3e5986217f6c4d55756bd9f93d67d9dd4957208","pytest_exit_code":d.get("pytest_exit_code"),"timed_out":d.get("timed_out"),"overall_green":d.get("overall_green"),"stats":{k:v for k,v in (d.get("stats") or {}).items() if k in ("collected","passed","failed","skipped","error","failures")}},ensure_ascii=False)[:9000])'
      - name: Preserve original current-suite logs, JSON and JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-broad-current-linux-c3e5986217f6
          path: |
            phase6-broad-current.json
            phase6-broad-current.log
            phase6-broad-current.xml
          retention-days: 14
          if-no-files-found: warn

  current-suite-windows:
    runs-on: windows-2022
    timeout-minutes: 38
    env:
      QT_QPA_PLATFORM: windows
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - name: Preserve unchanged workflow quarantine bytes on native Windows
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact tested E4 source and tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3e5986217f6c4d55756bd9f93d67d9dd4957208
          persist-credentials: false
      - name: Assert pinned current source SHA before broad Windows QA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'Requested source SHA: %s\\nActual source SHA: %s\\n' 'c3e5986217f6c4d55756bd9f93d67d9dd4957208' "$actual"
          test "$actual" = 'c3e5986217f6c4d55756bd9f93d67d9dd4957208'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original Windows test requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Execute entire current regression on disposable zero-active-workflow source
        run: |
          python scripts/run_quarantined_workflow_qa.py --mode current --timeout 1500 --json phase6-broad-current-windows.json --log phase6-broad-current-windows.log --junit phase6-broad-current-windows.xml
      - name: Report actual Windows summary without masking failures
        if: always()
        shell: bash
        run: |
          python -c 'import json,pathlib; p=pathlib.Path("phase6-broad-current-windows.json"); d=json.loads(p.read_text()) if p.is_file() else {"error":"No runner JSON was produced"}; print(json.dumps({"source_sha":"c3e5986217f6c4d55756bd9f93d67d9dd4957208","pytest_exit_code":d.get("pytest_exit_code"),"timed_out":d.get("timed_out"),"overall_green":d.get("overall_green"),"stats":{k:v for k,v in (d.get("stats") or {}).items() if k in ("collected","passed","failed","skipped","error","failures")}},ensure_ascii=False)[:9000])'
      - name: Preserve original native Windows JUnit logs and JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-broad-current-windows-c3e5986217f6
          path: |
            phase6-broad-current-windows.json
            phase6-broad-current-windows.log
            phase6-broad-current-windows.xml
          retention-days: 14
          if-no-files-found: warn
