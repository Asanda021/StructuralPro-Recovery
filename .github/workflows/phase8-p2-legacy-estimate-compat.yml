name: P8 P2 user legacy estimate compatibility (synthetic schema, private files excluded)
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - tests/test_phase8_p2_legacy_user_estimate_schema.py
      - .github/workflows/phase8-p2-legacy-estimate-compat.yml
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - tests/test_phase8_p2_legacy_user_estimate_schema.py
      - .github/workflows/phase8-p2-legacy-estimate-compat.yml
permissions:
  contents: read
concurrency:
  group: p8-p2-legacy-estimate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  legacy-pricebook-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install real product test dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Test real pricebook API with two tiny structurally equivalent synthetic workbook layouts
        run: python -m pytest -q tests/test_phase8_p2_legacy_user_estimate_schema.py tests/test_pricebook_user_import.py --junitxml=legacy-estimate-boundary.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-legacy-estimate-junit-${{ matrix.os }}
          path: legacy-estimate-boundary.xml
          if-no-files-found: warn
          retention-days: 14
