name: P6 Windows native intermittent access violation evidence
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-windows-native-access-violation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-four-repeat-original-oracle:
    runs-on: windows-2022
    timeout-minutes: 36
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: windows
    steps:
      - name: Preserve exact files on Windows checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert unmodified original formula code Qt callbacks and five-floor oracle
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:core/takeoff/manual_formula_register.py)" = "4e3750a0e797073d40bacb395e448da4f14b6c56"
          test "$(git rev-parse HEAD:app/manual_formula_controls.py)" = "07e8ce4567eec5122253cd220a49fed6e2e27d9e"
          test "$(git rev-parse HEAD:tests/test_manual_formula_fivefloor_closure.py)" = "f81c979051bcbaaf00015fa411314e28f370b291"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original test environment and external observation only
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Validate diagnostic exit-code and missing-JUnit guards
        run: |
          python -m py_compile scripts/diagnose_windows_native_crash.py
          python scripts/diagnose_windows_native_crash.py --self-check
      - name: Repeat original Qt oracle four times without profiling or code changes
        run: |
          python scripts/diagnose_windows_native_crash.py --repeats 4 --timeout-seconds 360 --sample-seconds 5 --output windows-native-evidence
      - name: Surface each original outcome preserving crash or timeout
        if: always()
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('windows-native-evidence/summary.json'); print(p.read_text(encoding='utf-8') if p.exists() else 'No diagnostic summary produced; do not claim PASS')"
      - name: Upload source-independent JUnit logs sampled RSS and sanitized fault module only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-windows-native-faulting-module-diagnostic
          path: windows-native-evidence/
          if-no-files-found: warn
          retention-days: 14
