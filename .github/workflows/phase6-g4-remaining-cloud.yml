name: P6 G4 remaining bounded Windows source GUI exports and recovery
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-g4-remaining-cloud.yml
      - scripts/diagnostics/p6_g4_cloud_remaining.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: windows
      STRUCTURALPRO_P6_QPA_PLATFORM: windows
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Install free document rendering engine
        shell: pwsh
        run: |
          choco install libreoffice-fresh --no-progress -y --limit-output
          if ($LASTEXITCODE -ne 0) { Write-Warning 'LibreOffice unavailable; rendering must be recorded BLOCKED_ENVIRONMENT' }
          exit 0
      - name: Original tests plus actual export readback and bounded render
        run: python scripts/diagnostics/p6_g4_cloud_remaining.py
      - name: Preserve original JUnit exports logs resource measurements and rendered pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-g4-remaining-windows
          path: g4-evidence/
          retention-days: 14
          if-no-files-found: error
