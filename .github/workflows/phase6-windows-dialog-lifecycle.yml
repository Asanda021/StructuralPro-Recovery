name: P6 Windows real Qt dialog lifecycle destroy reopen probe
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-windows-dialog-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dialog-lifecycle-native-windows:
    runs-on: windows-2022
    timeout-minutes: 26
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: windows
    steps:
      - name: Preserve repository file hashes across checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail closed if original product or original oracle changed
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:app/manual_takeoff.py)" = "12828195669dc2586cc3d5300e0781cf93183135"
          test "$(git rev-parse HEAD:app/manual_formula_controls.py)" = "07e8ce4567eec5122253cd220a49fed6e2e27d9e"
          test "$(git rev-parse HEAD:core/takeoff/manual_formula_register.py)" = "4e3750a0e797073d40bacb395e448da4f14b6c56"
          test "$(git rev-parse HEAD:core/projects/store.py)" = "0aa448bcc0f67bab12c37592f7abf01fd0e1765d"
          test "$(git rev-parse HEAD:tests/test_manual_formula_fivefloor_closure.py)" = "f81c979051bcbaaf00015fa411314e28f370b291"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install shared Windows test requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Validate diagnostic syntax and runner
        run: |
          python -m py_compile scripts/diagnostics/p6_native_isolation_oracles.py scripts/diagnose_windows_native_crash.py
          python scripts/diagnose_windows_native_crash.py --self-check
      - name: Probe runtime and native allowlisted library fingerprints
        run: python scripts/inspect_windows_native_environment.py --output lifecycle-evidence/environment.json
      - name: Exercise five native dialog destroy reopen cycles twice in separate processes
        continue-on-error: true
        run: python scripts/diagnose_windows_native_crash.py --arm dialog_lifecycle --repeats 2 --timeout-seconds 460 --sample-seconds 5 --output lifecycle-evidence/lifecycle
      - name: Run exact unchanged full integrated fivefloor as comparison once
        continue-on-error: true
        run: python scripts/diagnose_windows_native_crash.py --arm integrated --repeats 1 --timeout-seconds 460 --sample-seconds 5 --output lifecycle-evidence/integrated
      - name: Validate per-run original JUnit outcomes without overwriting evidence
        if: always()
        shell: pwsh
        run: |
          $green = $true
          foreach ($item in @(@('lifecycle', 2), @('integrated', 1))) {
            $arm = [string]$item[0]
            $wanted = [int]$item[1]
            $p = Join-Path 'lifecycle-evidence' "$arm/summary.json"
            if (!(Test-Path $p)) { Write-Host "$arm MISSING"; $green = $false; continue }
            $d = Get-Content -Raw -Encoding UTF8 $p | ConvertFrom-Json
            Write-Host "$arm count=$($d.runs.Count) overall_green=$($d.overall_green)"
            foreach ($r in $d.runs) {
              Write-Host "$arm attempt=$($r.attempt) exit=$($r.exit_hex) time=$($r.wall_seconds) JUnit=$($r.junit.passed) fail=$($r.junit.failed) error=$($r.junit.errors) skipped=$($r.junit.skipped) AV=$($r.access_violation)"
            }
            if ($d.runs.Count -ne $wanted -or !$d.overall_green) { $green = $false }
          }
          if (!$green) { throw 'LIFECYCLE_OR_INTEGRATED_RED; preserve artifact' }
      - name: Upload uncensored original JUnit and logs without native memory dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-windows-real-dialog-lifecycle-no-debugger
          path: lifecycle-evidence/
          retention-days: 14
          if-no-files-found: warn
