name: P6 E4 BOQ canonical identity Qt native acceptance
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-p5-e4-boq-identity-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e4-boq-canonical-route:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - name: Keep checkout bytes identical on Windows
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 64d637bfe8522349d78b30431a44527401ff7ce4
          persist-credentials: false
      - name: Check exact code and tests source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "64d637bfe8522349d78b30431a44527401ff7ce4"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt prerequisites
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install original requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Run actual BOQ search-to-display Qt and prior E4 regressions
        run: |
          python scripts/run_phase6_pytest.py 840 -q --junitxml=boq-route-${{ matrix.qpa }}.xml tests/test_phase6_p5_e4_boq_identity.py tests/test_phase6_p5_e4_search.py tests/test_phase6_p5_e4_ui.py tests/test_phase6_p5_e4_snapshot_race.py tests/test_phase6_p5_e4_identity_generation.py tests/test_phase6_p5_e4_sessions.py tests/test_e4_callback_contract.py
      - name: Upload actual JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-e4-boq-route-${{ matrix.qpa }}
          path: boq-route-${{ matrix.qpa }}.xml
          retention-days: 14
          if-no-files-found: warn
