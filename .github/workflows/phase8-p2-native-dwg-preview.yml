name: P8 P2 native read-only DWG open after strict decoder failure
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - core/drawings/native_dwg_preview.py
      - core/drawings/viewer_model.py
      - core/drawings/dwg_takeoff.py
      - tests/test_phase8_p2_native_dwg_readonly_preview.py
      - .github/workflows/phase8-p2-native-dwg-preview.yml
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - core/drawings/native_dwg_preview.py
      - core/drawings/viewer_model.py
      - core/drawings/dwg_takeoff.py
      - tests/test_phase8_p2_native_dwg_readonly_preview.py
      - .github/workflows/phase8-p2-native-dwg-preview.yml
permissions:
  contents: read
concurrency:
  group: p8p2-native-dwg-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-preview-without-financial-approval:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install core and public prebuilt DWG reader (no EXE build)
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q --only-binary=ezdwg "ezdwg[dxf]==0.17.0"
      - name: Run native DWG viewer and fail-closed quantity gates on real public sources
        run: python -m pytest -q tests/test_phase8_p2_native_dwg_readonly_preview.py --junitxml=p8p2-native-preview.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-native-preview-junit-${{ matrix.os }}
          path: p8p2-native-preview.xml
          if-no-files-found: warn
          retention-days: 14
