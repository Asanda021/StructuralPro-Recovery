name: P6 five-floor staged catalog verified measurement Linux Windows
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-fivefloor-staged-timings.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-original-qt-oracle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, qpa: offscreen}
          - {os: windows-2022, qpa: windows}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - name: Avoid Windows line ending differences
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Assert unchanged original product functions and acceptance oracle
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          git diff --exit-code cd855297af657a382c76909eabad7523688148a2 HEAD -- core/takeoff/manual_formula_register.py app/manual_formula_controls.py tests/test_manual_formula_fivefloor_closure.py
          python -m py_compile scripts/measure_fivefloor_stage.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native Qt dependencies on Linux
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install original QA dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Measure original Qt oracle with crash-survivable function journal
        run: python scripts/measure_fivefloor_stage.py --repeats 1 --timeout-seconds 480 --output stage-fivefloor
      - name: Print evidence even on failure without converting failures to passes
        if: always()
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('stage-fivefloor/summary.json'); print(p.read_text(encoding='utf-8') if p.exists() else 'No valid stage summary')"
      - name: Preserve original JUnit, stdout, isolated catalog and periodic snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-fivefloor-stage-${{ matrix.qpa }}
          path: stage-fivefloor/
          retention-days: 14
          if-no-files-found: warn
