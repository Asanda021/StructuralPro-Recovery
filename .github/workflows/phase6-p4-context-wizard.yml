name: Phase 6 P4 contextual W1 A2 real Qt acceptance
on:
  push:
    branches:
      - feature/phase6-p4-contextual-wizard-20261026
    paths:
      - .github/workflows/phase6-p4-context-wizard.yml
      - core/ai/contextual_takeoff.py
      - core/ai/gguf_runtime_v1.py
      - tests/test_phase6_p4_model_isolation.py
      - app/contextual_takeoff_panel.py
      - app/architecture_detail_editor.py
      - app/reviewed_structural_manual_editor.py
      - app/graphical_takeoff.py
      - tests/test_phase6_p4_contextual_takeoff.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase6-p4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p4-functional:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 23
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install approved application test requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Compile and execute real W1/A2 Qt and original assembly regression
        run: |
          python -m compileall -q core/ai/contextual_takeoff.py app/contextual_takeoff_panel.py app/graphical_takeoff.py
          python -c "import sys,faulthandler,pytest; faulthandler.dump_traceback_later(90,exit=True); sys.exit(pytest.main(sys.argv[1:]))" -vv --maxfail=1 --junitxml=p6-p4-${{ matrix.qpa }}.xml tests/test_phase6_p4_contextual_takeoff.py tests/test_phase6_p4_model_isolation.py tests/test_p601_p610_local_ai_gguf_runtime.py tests/test_phase6_p3_real_qt_four_view.py tests/test_phase6_p3_full_verified_boq.py tests/test_assembly_template_expansion.py
      - name: Preserve original test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-p4-qt-${{ matrix.qpa }}
          path: p6-p4-${{ matrix.qpa }}.xml
          retention-days: 14
          if-no-files-found: warn
