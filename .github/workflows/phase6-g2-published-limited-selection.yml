name: P6 G2 independent published IFC4 bounded subset read-only acceptance
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-g2-published-limited-selection.yml
      - scripts/diagnostics/p6_published_ifc_partial_selection.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-source-limited-view:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONFAULTHANDLER: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: .
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:core/drawings/bim_adapter.py)" = "48462b5e3689b2158f9565372d93a3603b15cea0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install normal source-backed IFC runtime
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Verify diagnostic syntax
        run: python -m py_compile scripts/diagnostics/p6_published_ifc_partial_selection.py
      - name: Original pinned IFC4 architecture and HVAC selected subset acceptance
        run: python scripts/diagnostics/p6_published_ifc_partial_selection.py --output p6-published-limited-results
      - name: Preserve sanitized aggregate reports, even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-g2-published-limited-${{ matrix.os }}
          path: p6-published-limited-results/summary.json
          if-no-files-found: warn
          retention-days: 14
