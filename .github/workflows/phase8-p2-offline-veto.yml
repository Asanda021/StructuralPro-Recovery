# No private DWG, merge, installer, release or paid takeoff.
name: P8 P2 offline DWG financial veto
on:
  push:
    branches:
      - fix/phase8-p2-offline-converter-veto-20261104
    paths:
      - core/drawings/dwg_takeoff.py
      - tests/test_phase8_p2_offline_financial_veto.py
      - tests/test_phase8_p2_alternate_provider_financial_veto.py
      - core/drawings/dwg_unknown_object_audit.py
      - tools/audit_phase8_p2_unknown_cad.py
      - tests/test_phase8_p2_unknown_object_audit.py
      - core/drawings/dwg_opaque_conversion_diff.py
      - tools/audit_phase8_p2_opaque_conversion_diff.py
      - tests/test_phase8_p2_opaque_conversion_diff.py
      - core/drawings/dwg_second_decoder_probe.py
      - tools/audit_phase8_p2_second_decoder.py
      - tests/test_phase8_p2_second_decoder_probe.py
      - core/drawings/dwg_native_roster_crosscheck.py
      - tools/audit_phase8_p2_native_roster_crosscheck.py
      - tests/test_phase8_p2_native_roster_crosscheck.py
      - tools/audit_phase8_p2_real_independent_sources.py
      - tests/test_phase8_p2_independent_roster_audit.py
      - core/drawings/dwg_insert_solid_contract.py
      - tools/audit_phase8_p2_block_solid.py
      - tests/test_phase8_p2_block_solid_contract.py
      - core/drawings/dwg_source_display_integrity.py
      - core/drawings/native_dwg_preview.py
      - core/drawings/dwg_converter.py
      - tools/audit_phase8_p2_solid_and_dictionary.py
      - tests/test_phase8_p2_solid_dictionary_integrity.py
      - tests/test_phase8_p2_converter_dictionary_receipt.py
      - tests/test_phase8_p2_native_solid_preview_receipt.py
      - core/drawings/dwg_opaque_source_receipt.py
      - core/drawings/dwg_map_aec_vendor_triage.py
      - core/drawings/dwg_custom_graph_coverage.py
      - core/drawings/dwg_custom_named_root_ancestry.py
      - core/drawings/dwg_legacy_vertex_bulge_audit.py
      - tests/test_phase8_p2_ac1032_vertex_bulge_parity.py
      - tools/audit_phase8_p2_opaque_source_bytes.py
      - tests/test_phase8_p2_opaque_source_receipts.py
      - tests/test_p8p2_map_aec_vendor_triage.py
      - tests/test_p8p2_custom_graph_coverage.py
      - tests/test_p8p2_custom_named_root_ancestry.py
      - tools/audit_phase8_p2_opaque_source_bytes.py
      - tests/test_phase8_p2_claude_review_remediation.py
      - core/cad/persian_text_v1.py
      - core/drawings/dwg_shx_source_audit.py
      - core/drawings/native_dwg_preview.py
      - tools/audit_phase8_p2_shx_source.py
      - tests/test_phase8_p2_shx_source_provenance.py
      - core/drawings/libredwg_error_mask.py
      - tests/test_phase8_p2_libredwg_error68.py
      - core/drawings/libredwg_native_trace_runner.py
      - tools/audit_phase8_p2_libredwg_native_capi.py
      - tools/structuralpro_libredwg_capi_probe.c
      - tools/P8P2_NATIVE_C_API_README_FA.md
      - tests/test_phase8_p2_libredwg_native_capi_runner.py
      - core/drawings/dwg_opaque_conversion_diff.py
      - .github/workflows/phase8-p2-offline-veto.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase8-p2-offline-veto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  target-checks:
    name: Fail-closed synthetic regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install project dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Check source commit
        run: git rev-parse HEAD
      - name: Run synthetic financial veto and CAD converter regression
        run: >-
          python -m pytest -q
          --junitxml=offline-dwg-financial-veto.xml
          tests/test_phase8_p2_offline_financial_veto.py
          tests/test_phase8_p2_alternate_provider_financial_veto.py
          tests/test_phase8_p2_unknown_object_audit.py
          tests/test_phase8_p2_opaque_conversion_diff.py
          tests/test_phase8_p2_second_decoder_probe.py
          tests/test_phase8_p2_native_roster_crosscheck.py
          tests/test_phase8_p2_independent_roster_audit.py
          tests/test_phase8_p2_block_solid_contract.py
          tests/test_phase8_p2_solid_dictionary_integrity.py
          tests/test_phase8_p2_converter_dictionary_receipt.py
          tests/test_phase8_p2_native_solid_preview_receipt.py
          tests/test_phase8_p2_opaque_source_receipts.py
          tests/test_p8p2_map_aec_vendor_triage.py
          tests/test_p8p2_custom_graph_coverage.py
          tests/test_p8p2_custom_named_root_ancestry.py
          tests/test_phase8_p2_ac1032_vertex_bulge_parity.py
          tests/test_phase8_p2_claude_review_remediation.py
          tests/test_phase8_p2_shx_source_provenance.py
          tests/test_phase8_p2_libredwg_error68.py
          tests/test_phase8_p2_libredwg_native_capi_runner.py
          tests/test_phase8_p2_converter_failure_cleanup.py
          tests/test_phase8_p2_dwg_dropped_line_verified_recovery.py
          tests/test_p57_dwg_dxf_validation.py
      - name: Store results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8-p2-offline-dwg-${{ matrix.os }}-${{ github.sha }}
          path: offline-dwg-financial-veto.xml
          if-no-files-found: ignore
          retention-days: 7
