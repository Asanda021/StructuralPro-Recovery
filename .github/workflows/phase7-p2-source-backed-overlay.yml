name: P7 priority2 source-backed 2D office bundle and original takeoff guards
on:
  push:
    branches:
      - feature/phase7-p2-source-backed-2d-overlay-20261031
    paths:
      - core/reports/source_backed_2d_overlay.py
      - core/reports/source_backed_2d_office_bundle.py
      - tests/test_phase7_p2_source_backed_2d_overlay.py
      - tests/test_phase7_p2_persisted_boq_crosswalk.py
      - tests/test_phase7_p2_office_bundle.py
      - .github/workflows/phase7-p2-source-backed-overlay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-backed-overlay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Native source-backed SVG and original source/geometry acceptance
        run: >-
          python -m pytest -q -o faulthandler_timeout=0
          --junitxml=p7-p2-source-backed.xml
          tests/test_phase7_p2_source_backed_2d_overlay.py
          tests/test_phase7_p2_persisted_boq_crosswalk.py
          tests/test_phase7_p2_office_bundle.py
          tests/test_phase7_p1_exact_persian_reports.py
          tests/test_recovery_office_export_contract.py
          tests/test_phase2_advanced_geometry.py
          tests/test_phase2_advanced_geometry_sqlite.py
          tests/test_real_pdf_vector_takeoff.py
          tests/test_drawing_takeoff_bridge.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p7-p2-source-svg-${{ matrix.os }}
          path: p7-p2-source-backed.xml
          retention-days: 14
          if-no-files-found: warn
