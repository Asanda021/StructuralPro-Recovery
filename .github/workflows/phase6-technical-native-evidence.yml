name: P6 technical audit native DPI and independent electrical source
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-technical-native-evidence.yml]
permissions:
  contents: read
jobs:
  native-shell:
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.25', '1.5', '2']
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      STRUCTURALPRO_P6_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      STRUCTURALPRO_P6_SCREENSHOT_DIR: native-shell-evidence/screenshots
      STRUCTURALPRO_E5_SCREENSHOTS: native-shell-evidence/docks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Existing tests using actual native Windows backend including child shell
        run: >-
          python -m pytest -q --junitxml=native-shell-evidence/native-shell.xml
          tests/test_phase6_p1_shell.py tests/test_phase6_p1_font_diagnostics.py
          tests/test_phase6_p5_e5_docks.py tests/test_phase6_final_workspace_contract.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-final-native-shell-${{ matrix.scale }}
          path: native-shell-evidence/
          retention-days: 14
          if-no-files-found: error

  independent-electrical:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Actual published IFC4 source picker process and electric member selection
        run: python -m pytest -q -o faulthandler_timeout=0 scripts/diagnostics/p6_electrical_native_acceptance.py --junitxml=electrical-evidence/original.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-independent-electrical-${{ matrix.os }}
          path: electrical-evidence/
          retention-days: 14
          if-no-files-found: error
