name: P7 E7 exact report layout and adjacent exporter QA
on:
  push:
    branches:
      - feature/phase7-e7-decimal-report-layout-20261031
    paths:
      - core/reports/designer.py
      - tests/test_phase7_e7_decimal_report_layout.py
      - .github/workflows/phase7-e7-report-layout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase7-e7:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install existing requirements
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Run original report contracts and new E7 assertions
        run: >-
          python -m pytest -q -o faulthandler_timeout=0
          --junitxml=phase7-e7.xml
          tests/test_phase7_e7_decimal_report_layout.py
          tests/test_recovery_office_export_contract.py
          tests/test_manual_formula_reports.py
      - name: Record exact source commit
        if: always()
        run: git rev-parse HEAD
      - name: Save JUnit even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p7-e7-junit-${{ matrix.os }}
          path: phase7-e7.xml
          retention-days: 14
          if-no-files-found: warn
