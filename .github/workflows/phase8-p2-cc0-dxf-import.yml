name: P8 P2 CC0 real external DXF production import (not DWG approval)
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - scripts/phase8_p2_cc0_dxf_import_probe.py
      - .github/workflows/phase8-p2-cc0-dxf-import.yml
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - scripts/phase8_p2_cc0_dxf_import_probe.py
      - .github/workflows/phase8-p2-cc0-dxf-import.yml
permissions:
  contents: read
concurrency:
  group: p8-p2-cc0-dxf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cc0-dxf-production-parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q "ezdxf>=1.3,<2"
      - name: Import real third-party DXF with existing production engine and independent LINE oracle
        run: python -m scripts.phase8_p2_cc0_dxf_import_probe --output p8p2-external-dxf-evidence.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-cc0-dxf-evidence-${{ matrix.os }}
          path: p8p2-external-dxf-evidence.json
          if-no-files-found: warn
          retention-days: 14
