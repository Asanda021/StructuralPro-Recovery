name: P8 P2 legacy metre to source-backed CAD reconciliation gate
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - core/drawings/legacy_metre_cad_reconciliation.py
      - core/platform/application.py
      - tests/test_phase8_p2_legacy_metre_cad_reconciliation.py
      - .github/workflows/phase8-p2-legacy-metre-cad-gate.yml
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - core/drawings/legacy_metre_cad_reconciliation.py
      - core/platform/application.py
      - tests/test_phase8_p2_legacy_metre_cad_reconciliation.py
      - .github/workflows/phase8-p2-legacy-metre-cad-gate.yml
permissions:
  contents: read
concurrency:
  group: phase8-p2-legacy-metre-cad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconciliation-review-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install product requirements without building executable
        run: python -m pip install -q -r requirements.txt
      - name: Gate old Persian metre, real DXF selection and failure scenarios
        run: python -m pytest -q tests/test_phase8_p2_legacy_metre_cad_reconciliation.py tests/test_phase8_p2_legacy_user_estimate_schema.py --junitxml=phase8-p2-metre-cad.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase8-p2-metre-cad-test-results-${{ matrix.os }}
          path: phase8-p2-metre-cad.xml
          if-no-files-found: warn
          retention-days: 14
