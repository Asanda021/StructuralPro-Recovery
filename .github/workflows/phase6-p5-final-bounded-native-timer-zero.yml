name: P6 P5 final bounded no-debugger Qt lifecycle timer-zero decision
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-p5-final-bounded-native-timer-zero.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-checkpoint-final:
    runs-on: windows-2022
    timeout-minutes: 16
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: windows
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Protect original fivefold oracle and product source hashes
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:core/takeoff/manual_formula_register.py)" = "4e3750a0e797073d40bacb395e448da4f14b6c56"
          test "$(git rev-parse HEAD:app/manual_formula_controls.py)" = "07e8ce4567eec5122253cd220a49fed6e2e27d9e"
          test "$(git rev-parse HEAD:app/manual_takeoff.py)" = "12828195669dc2586cc3d5300e0781cf93183135"
          test "$(git rev-parse HEAD:core/projects/store.py)" = "0aa448bcc0f67bab12c37592f7abf01fd0e1765d"
          test "$(git rev-parse HEAD:tests/test_manual_formula_fivefloor_closure.py)" = "f81c979051bcbaaf00015fa411314e28f370b291"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install original runtime, no CDB or profiler
        run: python -m pip install -q -r requirements.txt PySide6==6.12.0 ifcopenshell psutil
      - name: Static validation of diagnostic-only scripts
        run: |
          python -m py_compile scripts/diagnostics/p6_native_timer_zero_decision.py scripts/diagnostics/p6_faulthandler_probe.py scripts/diagnostics/p6_lifecycle_checkpoint.py scripts/diagnostics/p6_native_isolation_oracles.py
          python scripts/diagnose_windows_native_crash.py --self-check
      - name: Two original lifecycle runs without debugger, abort on first failure
        run: python scripts/diagnostics/p6_native_timer_zero_decision.py --output timer-zero-evidence
      - name: Preserve bounded sanitized evidence even when RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-p5-final-no-debugger-timer-zero-checkpoints
          path: |
            timer-zero-evidence/summary.json
            timer-zero-evidence/attempt-*.xml
            timer-zero-evidence/faulthandler-*.json
            timer-zero-evidence/checkpoints-*/last.json
            timer-zero-evidence/checkpoints-*/events.jsonl
          if-no-files-found: warn
          retention-days: 14
