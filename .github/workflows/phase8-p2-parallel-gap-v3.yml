# CI-only validation on the unmerged P8 P2 parallel-gap branch.
# No merge, build, release, or private DWG/PDF access.
name: P8 P2 parallel-gap v3 cross-platform validation
on:
  push:
    branches:
      - fix/phase8-p2-parallel-gap-v3-20261104
    paths:
      - core/drawings/cad_unit_parallel_gap.py
      - core/drawings/dwg_takeoff.py
      - tests/test_phase8_p1_parallel_gap_helper.py
      - tests/test_phase8_p1_parallel_gap_integration.py
      - .github/workflows/phase8-p2-parallel-gap-v3.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p8-p2-parallel-gap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-contract:
    name: Synthetic + adjacent CAD gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Preserve source newline representation
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin source SHA
        run: git rev-parse HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install declared project dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Run synthetic unit evidence and adjacent CAD regression
        run: >-
          python -m pytest -q -o faulthandler_timeout=0
          --junitxml=parallel-gap-v3-results.xml
          tests/test_phase8_p1_parallel_gap_helper.py
          tests/test_phase8_p1_parallel_gap_integration.py
          tests/test_phase2_priority4_closure.py
          tests/test_phase8_p2_native_preview_geometry.py
          tests/test_phase8_p2_converter_failure_cleanup.py
      - name: Publish test report, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8-p2-parallel-gap-${{ matrix.os }}-${{ github.sha }}
          path: parallel-gap-v3-results.xml
          if-no-files-found: ignore
          retention-days: 7
