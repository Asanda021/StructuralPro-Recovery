# One scoped native-Windows recheck of five Linux SKIPs; no build/release/merge.
name: P6 five Windows-only regression checks
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-p5-windows-five-skips.yml
permissions:
  contents: read
jobs:
  native-five:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: windows
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - name: Disable line-ending transformation before checkout
        run: git config --global core.autocrlf false
      - name: Checkout exact verified product code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7cbeac9b245586bf83922bc4dbf2783de56214ad
          persist-credentials: false
      - name: Check exact source SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '7cbeac9b245586bf83922bc4dbf2783de56214ad'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing product/test dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Run exactly five Windows-only cases in safe disposable source
        shell: bash
        run: |
          python - <<'PY'
          import os,sys,subprocess,tempfile,json,xml.etree.ElementTree as ET
          from pathlib import Path
          from scripts.run_quarantined_workflow_qa import prepare_source, current_policy
          test_ids=["tests/test_phase4_sqlite_windows_native.py::test_windows_live_connection_blocks_rename_and_preserves_committed_revisions","tests/test_phase4_sqlite_windows_native.py::test_windows_closed_database_can_be_moved_then_reopened_safely","tests/test_phase5_p3_trusted_identity_store.py::test_windows_identity_is_read_from_the_live_access_token","tests/test_phase5_unified_packaging.py::test_windows_single_edition_validate_only_does_not_build","tests/test_phase5_windows_native_acceptance.py::test_current_windows_token_principal_reaches_projectstore_and_real_qt_workspace"]
          root=Path.cwd().resolve()
          xml=root/'p6-native-five.xml'
          log=root/'p6-native-five.log'
          summary=root/'p6-native-five.json'
          summary.unlink(missing_ok=True)
          xml.unlink(missing_ok=True)
          log.unlink(missing_ok=True)
          report={'source_sha':'7cbeac9b245586bf83922bc4dbf2783de56214ad','requested_tests':test_ids,'target':'windows-2022','overall_green':False}
          try:
              with tempfile.TemporaryDirectory(prefix='p6_native_five_') as temp:
                  staged=prepare_source(root,Path(temp))
                  report['source_policy']=current_policy(staged)
                  env=dict(os.environ,PYTHONPATH=str(staged),QT_QPA_PLATFORM='windows')
                  cmd=[sys.executable,'-m','pytest','-vv','-o','faulthandler_timeout=60','--junitxml='+str(xml),*test_ids]
                  proc=subprocess.run(cmd,cwd=staged,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,encoding='utf-8',errors='replace',timeout=600)
                  log.write_text(proc.stdout,encoding='utf-8')
                  print(proc.stdout[-12000:],flush=True)
                  report['pytest_exit_code']=proc.returncode
                  if xml.is_file():
                      cases=ET.parse(xml).getroot().findall('.//testcase')
                      outcomes=[{'name':case.get('classname','')+'::'+case.get('name',''),
                                 'failed':case.find('failure') is not None,
                                 'error':case.find('error') is not None,
                                 'skipped':case.find('skipped') is not None} for case in cases]
                      report['cases']=outcomes
                      report['passed']=sum(not (o['failed'] or o['error'] or o['skipped']) for o in outcomes)
                      report['failed']=sum(o['failed'] for o in outcomes)
                      report['errors']=sum(o['error'] for o in outcomes)
                      report['skipped']=sum(o['skipped'] for o in outcomes)
                      report['overall_green']=(proc.returncode==0 and len(cases)==5 and report['passed']==5)
          except Exception as exc:
              report['setup_or_runtime_error']=str(exc)
              log.write_text('NOT VERIFIED: '+repr(exc)+'\n',encoding='utf-8')
          summary.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='cases'},ensure_ascii=False),flush=True)
          sys.exit(0 if report['overall_green'] else 1)
          PY
      - name: Upload original real native JUnit, log and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-windows-five-7cbeac9b2455
          path: |
            p6-native-five.xml
            p6-native-five.log
            p6-native-five.json
          retention-days: 14
          if-no-files-found: warn
