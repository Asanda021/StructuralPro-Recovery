name: P6 P5 native crash isolation core SQLite vs Qt vs integrated
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-windows-native-isolation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-independent-oracles-on-one-windows-runner:
    runs-on: windows-2022
    timeout-minutes: 38
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: windows
    steps:
      - name: Disable changing original Windows source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require identical unchanged product and original fivefloor test blobs
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:core/takeoff/manual_formula_register.py)" = "4e3750a0e797073d40bacb395e448da4f14b6c56"
          test "$(git rev-parse HEAD:app/manual_formula_controls.py)" = "07e8ce4567eec5122253cd220a49fed6e2e27d9e"
          test "$(git rev-parse HEAD:core/projects/store.py)" = "0aa448bcc0f67bab12c37592f7abf01fd0e1765d"
          test "$(git rev-parse HEAD:tests/test_manual_formula_fivefloor_closure.py)" = "f81c979051bcbaaf00015fa411314e28f370b291"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install shared exact-run package environment
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Validate original runner and new diagnostics without launching test
        run: |
          python -m py_compile scripts/diagnose_windows_native_crash.py scripts/diagnostics/p6_native_isolation_oracles.py
          python scripts/diagnose_windows_native_crash.py --self-check
      - name: Store allowlisted Windows Qt SQLite DLL environment manifest
        run: python scripts/inspect_windows_native_environment.py --output native-isolation-evidence/environment.json
      - name: A real 70-row SQLite formula service without QApplication repeat twice
        continue-on-error: true
        run: python scripts/diagnose_windows_native_crash.py --arm core --repeats 2 --timeout-seconds 420 --sample-seconds 5 --output native-isolation-evidence/core
      - name: B native Qt table selection only without SQLite or service repeat twice
        continue-on-error: true
        run: python scripts/diagnose_windows_native_crash.py --arm qt --repeats 2 --timeout-seconds 420 --sample-seconds 5 --output native-isolation-evidence/qt
      - name: C original five-floor integrated Qt plus SQLite unchanged repeat twice
        continue-on-error: true
        run: python scripts/diagnose_windows_native_crash.py --arm integrated --repeats 2 --timeout-seconds 420 --sample-seconds 5 --output native-isolation-evidence/integrated
      - name: Report and gate every arm according to original JUnit and crash exit
        if: always()
        shell: pwsh
        run: |
          $green = $true
          foreach ($arm in @('core', 'qt', 'integrated')) {
            $p = Join-Path 'native-isolation-evidence' "$arm/summary.json"
            if (!(Test-Path $p)) { Write-Host "$arm NO SUMMARY / NO PASS"; $green = $false; continue }
            $d = Get-Content -Raw -Encoding UTF8 $p | ConvertFrom-Json
            Write-Host "$arm count=$($d.runs.Count) green=$($d.overall_green) root-proven=$($d.native_root_cause_proven)"
            foreach ($r in $d.runs) {
              Write-Host "$arm run=$($r.attempt) exit=$($r.exit_hex) wall=$($r.wall_seconds) junit=$($r.junit.passed) fail=$($r.junit.failed) error=$($r.junit.errors) skipped=$($r.junit.skipped) AV=$($r.access_violation)"
            }
            if ($d.runs.Count -ne 2 -or !$d.overall_green) { $green = $false }
          }
          if (!$green) { throw 'ONE_OR_MORE_NATIVE_ISOLATION_ORACLES_RED; evidence preserved' }
      - name: Preserve raw JUnit stdout samples and sanitized DLL manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-windows-three-arm-native-isolation
          path: native-isolation-evidence/
          retention-days: 14
          if-no-files-found: warn
