name: P8 P2 independent R2004 FileDepList raw-page oracle
on:
  push:
    branches:
      - fix/phase8-p2-offline-converter-veto-20261104
    paths:
      - tools/p8p2_r2004_fdl_page_oracle.py
      - tests/test_phase8_p2_r2004_fdl_page_oracle.py
      - .github/workflows/phase8-p2-r2004-raw-page-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    name: Independent raw-page parser / synthetic-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify all synthetic raw-page and fail-closed guards
        run: |
          python -m pip install -q pytest==9.0.2
          python -m pytest -q tests/test_phase8_p2_r2004_fdl_page_oracle.py
      # No private drawings or geometry data are ever available in this job.
