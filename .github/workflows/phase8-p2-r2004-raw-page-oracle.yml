name: P8 P2 independent R2004 FileDepList raw-page oracle
on:
  push:
    branches:
      - fix/phase8-p2-offline-converter-veto-20261104
    paths:
      - tools/p8p2_r2004_fdl_page_oracle.py
      - tests/test_phase8_p2_r2004_fdl_page_oracle.py
      - tools/p8p2_r2004_section_map.py
      - tools/p8p2_patch_r2004_fdl_string32.py
      - tools/p8p2_r2004_fdl_native_test.c
      - tests/test_phase8_p2_r2004_section_map.py
      - tests/test_phase8_p2_r2004_fdl_string32_patch.py
      - .github/workflows/phase8-p2-r2004-raw-page-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    name: Independent raw-page parser / synthetic-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify all synthetic raw-page and fail-closed guards
        run: |
          python -m pip install -q pytest==9.0.2 PySide6==6.8.3 openpyxl==3.1.5 reportlab==4.4.9 python-docx==1.2.0 arabic-reshaper==3.0.0 python-bidi==0.6.7
          python -m pytest -q tests/test_phase8_p2_r2004_fdl_page_oracle.py tests/test_phase8_p2_r2004_section_map.py tests/test_phase8_p2_r2004_fdl_string32_patch.py tests/test_p631_p640_rtl_reports.py tests/test_commercial_outputs.py tests/test_priority_40_version_capability.py
      # No private drawings or geometry data are ever available in this job.
  native-synthetic:
    name: Pinned native String32 correction / synthetic-only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch exact public upstream and apply scoped diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/LibreDWG/libredwg.git "$RUNNER_TEMP/fdl-upstream"
          git -C "$RUNNER_TEMP/fdl-upstream" fetch --depth=1 origin a83575825b86528bf1997484852b2a9f5cdbbac0
          git -C "$RUNNER_TEMP/fdl-upstream" checkout --detach a83575825b86528bf1997484852b2a9f5cdbbac0
          git -C "$RUNNER_TEMP/fdl-upstream" submodule update --init --recursive
          python -m tools.p8p2_patch_r2004_fdl_string32 "$RUNNER_TEMP/fdl-upstream"
          # Test-only entry point into the real private native decoder function.
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'fdl-upstream/src/decode.c'
          s = p.read_text()
          assert s.count('static int\nfiledeplist_private (') == 1
          p.write_text(s + '\nint sp_p8p2_test_filedeplist (Bit_Chain *dat, Dwg_Data *dwg) { return filedeplist_private (dat, dwg); }\n')
          PY
      - name: Build read-only native diagnostic and run synthetic boundary cases
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/fdl-upstream" -B "$RUNNER_TEMP/fdl-build" \
            -DLIBREDWG_LIBONLY=ON -DBUILD_SHARED_LIBS=OFF -DENABLE_LTO=OFF \
            -DLIBREDWG_DISABLE_WRITE=ON -DLIBREDWG_DISABLE_JSON=ON -DDISABLE_WERROR=ON \
            -DCMAKE_C_FLAGS=-O0
          cmake --build "$RUNNER_TEMP/fdl-build" --parallel 2
          cc -I"$RUNNER_TEMP/fdl-upstream/include" -I"$RUNNER_TEMP/fdl-upstream/src" \
            -I"$RUNNER_TEMP/fdl-build/src" tools/p8p2_r2004_fdl_native_test.c \
            "$RUNNER_TEMP/fdl-build/libredwg.a" -lm -o "$RUNNER_TEMP/fdl-native-test"
          "$RUNNER_TEMP/fdl-native-test"
      # No binary packaging, artifact upload, release or private input.
