name: P6 G2 pinned independent site and renovation source feasibility
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-g2-independent-site-renovation-discovery.yml
      - scripts/diagnostics/p6_g2_independent_site_renovation_discovery.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce exact HEAD checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install real IfcOpenShell and Qt
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
          python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Preserve source SHA, parser census, and contract refusal independently
        run: |
          python -m py_compile scripts/diagnostics/p6_g2_independent_site_renovation_discovery.py
          python scripts/diagnostics/p6_g2_independent_site_renovation_discovery.py --out g2-site-renovation-source-audit
      - name: Upload aggregate only, no original IFC content
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-g2-public-site-renovation-feasibility
          path: g2-site-renovation-source-audit/summary.json
          retention-days: 14
          if-no-files-found: error
