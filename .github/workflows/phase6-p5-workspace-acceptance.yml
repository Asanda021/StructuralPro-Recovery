name: Phase 6 P5 E3 E4 E5 E6 real Qt and canonical service acceptance
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-p5-workspace-acceptance.yml
      - app/main.py
      - app/project_start_wizard.py
      - app/project_search_panel.py
      - app/verified_search_navigation.py
      - app/graphical_takeoff.py
      - app/workspace_docks.py
      - app/manual_formula_controls.py
      - core/projects/start_templates.py
      - core/projects/store.py
      - core/platform/application.py
      - core/search/global_search.py
      - core/takeoff/manual_formula_register.py
      - tests/test_phase6_p5_*.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase6-p5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p5-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install application dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Compile E3 to E6 and run Qt plus canonical regression
        run: |
          python -m compileall -q app/main.py app/project_start_wizard.py app/project_search_panel.py app/workspace_docks.py app/manual_formula_controls.py core/projects/start_templates.py core/search/global_search.py core/takeoff/manual_formula_register.py core/platform/application.py core/projects/store.py
          python -c "import sys,faulthandler,pytest; faulthandler.dump_traceback_later(160,exit=True); sys.exit(pytest.main(sys.argv[1:]))" -q --maxfail=1 --junitxml=p6-p5-${{ matrix.qpa }}.xml tests/test_phase6_p5_e3_templates.py tests/test_phase6_p5_e3_ui.py tests/test_phase6_p5_e4_search.py tests/test_phase6_p5_e4_ui.py tests/test_phase6_p5_e5_docks.py tests/test_phase6_p3_real_project_bridge.py tests/test_phase6_p5_e6_bulk_preview.py tests/test_manual_formula_persistence.py tests/test_phase6_p4_contextual_takeoff.py tests/test_phase6_p3_real_qt_four_view.py
      - name: Upload JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-p5-qt-${{ matrix.qpa }}
          path: p6-p5-${{ matrix.qpa }}.xml
          retention-days: 14
          if-no-files-found: warn
