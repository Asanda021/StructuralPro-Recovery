name: Phase 6 P5 E3 E4 E5 E6 real Qt and canonical service acceptance
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-p5-workspace-acceptance.yml
      - app/main.py
      - app/desktop_preferences.py
      - tests/test_phase6_p1_font_diagnostics.py
      - tests/test_recovery_quarantined_workflow_qa.py
      - tests/historical_contracts.py
      - scripts/run_quarantined_workflow_qa.py
      - core/drawings/ifc_lineage.py
      - core/takeoff/manual_formula_amendments.py
      - app/architecture_detail_editor.py
      - app/ifc_lineage_controls.py
      - app/project_start_wizard.py
      - app/project_search_panel.py
      - app/verified_search_navigation.py
      - app/bored_pile_detail_editor.py
      - tests/test_bored_pile_real_qt_stabilization.py
      - tests/test_bored_pile_draft_amendment_real_qt.py
      - tests/test_phase2_pdf_roof_ui.py
      - tests/test_phase2_priority3_close_ui.py
      - app/graphical_takeoff.py
      - app/beam_detail_panel.py
      - app/reviewed_aec_manual_editor.py
      - app/reviewed_structural_manual_editor.py
      - app/roof_detail_editor.py
      - app/workspace_docks.py
      - app/manual_formula_controls.py
      - core/projects/start_templates.py
      - core/projects/store.py
      - core/platform/application.py
      - core/search/global_search.py
      - core/drawings/pdf_engine.py
      - core/drawings/pdf_graphical.py
      - core/drawings/takeoff_session.py
      - core/takeoff/manual_formula_register.py
      - tests/test_phase6_p5_*.py
      - tests/test_phase6_p4_contextual_takeoff.py
      - tests/test_master13_desktop_shell_runtime.py
      - tests/test_beam_detail_workflow.py
      - tests/test_phase2_priority5_complete.py
      - tests/test_phase2_priority5_ifc_lineage_chat.py
      - tests/test_manual_formula_qt_closure.py
      - tests/test_manual_structured_units.py
      - core/drawings/ifc_pipeline.py
      - scripts/phase6_acceptance_summary.py
      - scripts/run_phase6_pytest.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase6-p5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p5-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      STRUCTURALPRO_E5_SCREENSHOTS: e5-screenshots
      STRUCTURALPRO_P6_FONT_DIR: p6-font-screenshots
    steps:
      - name: Preserve exact quarantined bytes on Windows checkout
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install application dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Compile E3 to E6 and run Qt plus canonical regression
        run: |
          python -m compileall -q app/bored_pile_detail_editor.py app/main.py app/desktop_preferences.py app/project_start_wizard.py app/project_search_panel.py app/workspace_docks.py app/manual_formula_controls.py core/projects/start_templates.py core/search/global_search.py core/takeoff/manual_formula_register.py core/platform/application.py core/projects/store.py
          python scripts/run_phase6_pytest.py 720 -q --maxfail=1 --junitxml=p6-p5-${{ matrix.qpa }}.xml tests/test_phase6_p5_e3_templates.py tests/test_phase6_p5_e3_ui.py tests/test_phase6_p5_e4_search.py tests/test_phase6_p5_e4_ui.py tests/test_phase6_p5_e4_sessions.py tests/test_phase6_p5_e5_docks.py tests/test_phase6_p3_real_project_bridge.py tests/test_phase6_p5_e6_bulk_preview.py tests/test_phase6_p5_e6_ifc_transfer_history.py tests/test_phase2_priority5_complete.py tests/test_phase2_priority5_ifc_lineage_chat.py tests/test_manual_formula_persistence.py tests/test_manual_formula_qt_closure.py tests/test_manual_structured_units.py tests/test_beam_detail_workflow.py tests/test_phase6_p4_contextual_takeoff.py tests/test_phase6_p3_real_qt_four_view.py tests/test_master13_desktop_shell_runtime.py tests/test_phase6_p1_font_diagnostics.py tests/test_roof_specialist_ui.py tests/test_waffle_specialist_ui.py tests/test_bored_pile_real_qt_stabilization.py tests/test_bored_pile_draft_amendment_real_qt.py tests/test_phase2_pdf_roof_ui.py tests/test_phase2_priority3_close_ui.py
      - name: Verify safely quarantined historical contracts
        if: always()
        run: python scripts/run_quarantined_workflow_qa.py --mode historical --timeout 180 --json p6-historical-${{ matrix.qpa }}.json --log p6-historical-${{ matrix.qpa }}.log --junit p6-historical-${{ matrix.qpa }}.xml
      - name: Verify quarantine isolation security
        if: always()
        env:
          PHASE6_PYTEST_LOG_PATH: p6-qa-security-${{ matrix.qpa }}.log
        run: python scripts/run_phase6_pytest.py 180 -q tests/test_recovery_quarantined_workflow_qa.py --junitxml=p6-qa-security-${{ matrix.qpa }}.xml
      - name: Verify Qt workspace at 150 percent scale
        if: always()
        env:
          QT_SCALE_FACTOR: '1.5'
          PHASE6_PYTEST_LOG_PATH: p6-p5-dpi150-${{ matrix.qpa }}.log
          STRUCTURALPRO_E5_SCREENSHOTS: e5-screenshots-scale150
        run: python scripts/run_phase6_pytest.py 180 -q tests/test_phase6_p5_e5_docks.py --junitxml=p6-p5-dpi150-${{ matrix.qpa }}.xml
      - name: Verify scaled Qt workspace
        if: always()
        env:
          QT_SCALE_FACTOR: '2'
          PHASE6_PYTEST_LOG_PATH: p6-p5-dpi-${{ matrix.qpa }}.log
          STRUCTURALPRO_E5_SCREENSHOTS: e5-screenshots-scale2
        run: python scripts/run_phase6_pytest.py 180 -q tests/test_phase6_p5_e5_docks.py --junitxml=p6-p5-dpi-${{ matrix.qpa }}.xml
      - name: Summarize actual JUnit counts and provenance
        if: always()
        run: python scripts/phase6_acceptance_summary.py p6-p5-${{ matrix.qpa }}.xml p6-p5-dpi-${{ matrix.qpa }}.xml p6-p5-dpi150-${{ matrix.qpa }}.xml p6-historical-${{ matrix.qpa }}.xml p6-qa-security-${{ matrix.qpa }}.xml
      - name: Upload JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-p5-qt-${{ matrix.qpa }}
          path: |
            p6-p5-${{ matrix.qpa }}.xml
            p6-p5-dpi-${{ matrix.qpa }}.xml
            p6-p5-dpi150-${{ matrix.qpa }}.xml
            p6-historical-${{ matrix.qpa }}.xml
            p6-historical-${{ matrix.qpa }}.json
            p6-historical-${{ matrix.qpa }}.log
            p6-qa-security-${{ matrix.qpa }}.xml
            p6-qa-security-${{ matrix.qpa }}.log
            p6-p5-dpi150-${{ matrix.qpa }}.log
            p6-p5-dpi-${{ matrix.qpa }}.log
            phase6-acceptance-summary.json
            phase6-pytest.log
            e5-screenshots/*.png
            p6-font-screenshots/*.png
            e5-screenshots-scale2/*.png
            e5-screenshots-scale150/*.png
          retention-days: 14
          if-no-files-found: warn
