name: P8 P2 historical forks and canonical behavioral parity
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - scripts/phase8_p2_fork_audit.py
      - .github/workflows/phase8-p2-fork-parity.yml
      - docs/acceptance/phase8_p2/**
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - scripts/phase8_p2_fork_audit.py
      - .github/workflows/phase8-p2-fork-parity.yml
      - docs/acceptance/phase8_p2/**
permissions:
  contents: read
concurrency:
  group: p8-p2-fork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-git-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare immutable fork blobs; mark missing semantics honestly
        run: python scripts/phase8_p2_fork_audit.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8-p2-historical-fork-blob-matrix
          path: phase8-p2-fork-audit.json
          retention-days: 14
          if-no-files-found: error
  canonical-behavioral-regressions:
    name: Canonical source P3 P4 contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 27
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: PR30 selection 2D 3D tree BOQ and permission proof contracts
        run: >-
          python scripts/run_phase6_pytest.py 500 -q
          --junitxml=phase8-p2-fork-p3.xml
          tests/test_phase6_p3_full_verified_boq.py
          tests/test_phase6_p3_verified_selection.py
          tests/test_phase6_p3_selection_panel.py
          tests/test_phase6_p3_real_project_bridge.py
          tests/test_phase6_p3_four_view_final.py
      - name: PR32 W1 A2 safety and PR33 contextual specialist canonical behavior
        run: >-
          python scripts/run_phase6_pytest.py 500 -q
          --junitxml=phase8-p2-fork-p4.xml
          tests/test_phase6_p4_contextual_takeoff.py
          -k "review_questions or existing_assembly or proposal_revocation or review_ledger or persisted_boq or matching_approved_templates or a2_existing_engineering_assistant or failed_context_refresh or w1_live_identity_change or specialist_fields"
      - name: Preserve original native behavior JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8-p2-fork-behavior-${{ matrix.os }}
          path: |
            phase8-p2-fork-p3.xml
            phase8-p2-fork-p4.xml
            phase6-pytest.log
          retention-days: 14
          if-no-files-found: warn
