name: P6 inspect actual Linux native crash and reproduce exact source
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-linux-qt-crash-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cd855297af657a382c76909eabad7523688148a2
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p6-broad-current-linux
          run-id: 40749998943
          github-token: ${{ github.token }}
          path: original-linux-failure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect original failed JSON and full retained log
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('original-linux-failure')
          data=json.loads((root/'phase6-broad-current.json').read_text())
          raw=(root/'phase6-broad-current.log').read_bytes()
          log=raw.decode('utf-8',errors='replace')
          result={k:data.get(k) for k in ('pytest_exit_code','timed_out','junit_report_written','overall_green','timeout_seconds')}
          result.update(log_bytes=len(raw),log_sha256=hashlib.sha256(raw).hexdigest(),junit_exists=(root/'phase6-broad-current.xml').exists(),log_tail=log[-14000:])
          Path('original-linux-inspected.json').write_text(json.dumps(result,indent=2))
          print('::notice title=Actual failed Linux artifact::'+json.dumps({k:v for k,v in result.items() if k!='log_tail'}))
          for i in range(0,len(result['log_tail']),2400):
              chunk=result['log_tail'][i:i+2400]
              print('::notice title=Original Linux log chunk '+str(i//2400)+'::'+chunk.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - name: Install original Qt test prerequisites
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
          python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Reproduce actual failing test with immediate preceding Qt and SQLite modules
        run: |
          test "$(git rev-parse HEAD)" = 'cd855297af657a382c76909eabad7523688148a2'
          python scripts/run_phase6_pytest.py 420 -vv -s -o faulthandler_timeout=60 --junitxml=linux-crash-reproducer.xml tests/test_manual_final_forms.py tests/test_manual_final_sorting.py tests/test_manual_five_storey_acceptance.py tests/test_manual_formula_amendments.py tests/test_manual_formula_deduction_commands.py tests/test_manual_formula_fivefloor_closure.py
      - name: Inspect actual reproducer JUnit
        if: always()
        run: python scripts/phase6_acceptance_summary.py linux-crash-reproducer.xml
      - name: Preserve original crash and exact-source reproducer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-linux-native-crash-diagnostic
          path: |
            original-linux-failure/*
            original-linux-inspected.json
            linux-crash-reproducer.xml
            phase6-pytest.log
            phase6-acceptance-summary.json
          if-no-files-found: warn
          retention-days: 14
