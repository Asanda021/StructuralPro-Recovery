name: P8 P2 String32 product converter boundary review (synthetic only)
on:
  push:
    branches:
      - fix/phase8-p2-offline-converter-veto-20261104
    paths:
      - tests/test_phase8_p2_string32_product_boundary_review.py
      - core/drawings/dwg_converter.py
      - core/drawings/libredwg_error_mask.py
      - .github/workflows/phase8-p2-string32-product-boundary-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-cli-contract:
    name: Verify experimental CLI has no quantity authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic product converter safety contract
        run: |
          python -m pip install -q pytest==9.0.2 ezdxf==1.4.4
          python -m pytest -q tests/test_phase8_p2_string32_product_boundary_review.py tests/test_phase8_p2_libredwg_error68.py
      # No private DWG or converter candidate, and no production integration.
