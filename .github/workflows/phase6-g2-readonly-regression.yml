name: P6 G2 spatial and existing source security regression original pytest
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-g2-readonly-regression.yml
      - tests/test_phase6_g2_spatial_readonly_guards.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g2-guard-scope:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Original source/quantity strict guards and real site context fails closed
        run: >
          python -m pytest -q -o faulthandler_timeout=0
          tests/test_phase6_g2_spatial_readonly_guards.py
          tests/test_phase6_multidiscipline_ifc4_geometry.py
          --junitxml=p6-g2-spatial-readonly-junit.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-g2-readonly-guard-${{ matrix.os }}
          path: p6-g2-spatial-readonly-junit.xml
          if-no-files-found: warn
          retention-days: 14
