name: P7 priority4 audited technical office revision and prior reporting guards
on:
  push:
    branches:
      - feature/phase7-p4-technical-office-reports-20261031
    paths:
      - core/reports/technical_office_revision.py
      - core/reports/technical_office_dossier.py
      - tests/test_phase7_p4_technical_office_revision.py
      - tests/test_phase7_p4_technical_office_dossier.py
      - .github/workflows/phase7-p4-technical-office.yml
  pull_request:
    branches:
      - feature/phase7-p3-versioned-report-batch-20261031
    paths:
      - core/reports/technical_office_revision.py
      - tests/test_phase7_p4_technical_office_revision.py
      - .github/workflows/phase7-p4-technical-office.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  technical-office:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Compile P4 and prior report engines
        run: python -m py_compile core/reports/technical_office_revision.py core/reports/technical_office_dossier.py core/reports/custom_batch.py core/reports/project_report.py
      - name: Native SQLite history delta, four exporters, controls and original source guards
        run: >-
          python -m pytest -q
          --junitxml=p7-p4-targeted.xml
          tests/test_phase7_p4_technical_office_revision.py
          tests/test_phase7_p4_technical_office_dossier.py
          tests/test_phase7_p3_custom_batch.py
          tests/test_phase7_p3_custom_report_ui.py
          tests/test_phase7_p2_persisted_boq_crosswalk.py
          tests/test_phase7_p2_source_backed_2d_overlay.py
          tests/test_phase7_p1_exact_persian_reports.py
          tests/test_recovery_office_export_contract.py
          tests/test_phase4_site_report_localization.py
          tests/test_phase4_reports.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p7-p4-revision-targeted-${{ matrix.os }}
          path: p7-p4-targeted.xml
          retention-days: 14
          if-no-files-found: warn
