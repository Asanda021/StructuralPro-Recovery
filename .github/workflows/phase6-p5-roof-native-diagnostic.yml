name: P6 P5 native roof regression diagnostic
on:
  push:
    branches:
      - feature/phase6-p5-workspace-e3-e6-20261027
    paths:
      - .github/workflows/phase6-p5-roof-native-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-roof:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: windows
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - name: Preserve archive bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3d1ac2d7a6be62b09e2daf17472632e022efcf06
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Run actual roof tests with first failure retained
        run: python scripts/run_phase6_pytest.py 240 -vv -s --maxfail=1 tests/test_phase2_pdf_roof_ui.py tests/test_phase2_priority3_close_ui.py --junitxml=roof-native.xml
      - name: Surface original pytest log and JUnit counts
        if: always()
        shell: bash
        run: |
          python -c 'import pathlib; p=pathlib.Path("phase6-pytest.log"); t=p.read_text(encoding="utf-8",errors="replace")[-3500:] if p.is_file() else "No original log"; print("::notice title=Native roof diagnostic::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          python scripts/phase6_acceptance_summary.py roof-native.xml
      - name: Preserve original native artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-native-roof-diagnostic-3d1ac2d
          path: |
            roof-native.xml
            phase6-pytest.log
            phase6-acceptance-summary.json
          retention-days: 14
          if-no-files-found: warn
