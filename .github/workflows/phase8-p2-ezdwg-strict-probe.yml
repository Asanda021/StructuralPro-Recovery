name: P8 P2 independent Python DWG strict conversion (public CC0 only)
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - scripts/phase8_p2_ezdwg_strict_probe.py
      - core/cad/optional_strict_python_dwg_provider.py
      - core/drawings/dwg_takeoff.py
      - core/drawings/legacy_metre_cad_reconciliation.py
      - .github/workflows/phase8-p2-ezdwg-strict-probe.yml
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - scripts/phase8_p2_ezdwg_strict_probe.py
      - .github/workflows/phase8-p2-ezdwg-strict-probe.yml
permissions:
  contents: read
concurrency:
  group: p8-p2-ezdwg-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-public-dwg:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install prebuilt PyPI wheel and current CAD parser; compile no executables
        run: python -m pip install -q --only-binary=ezdwg "ezdwg[dxf]==0.17.0" "ezdxf>=1.3,<2"
      - name: Download public pinned Linux prebuilt DWG reader for separate PRIVATE local analysis
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python -m pip download -q --no-deps --only-binary=:all: "ezdwg==0.17.0" -d public-reader-wheel
      - name: Verify exact official PyPI wheel checksum, reject altered bytes
        if: matrix.os == 'ubuntu-24.04'
        run: python -c "from pathlib import Path; import hashlib; a=list(Path('public-reader-wheel').glob('ezdwg-0.17.0-*.whl')); assert len(a)==1; actual=hashlib.sha256(a[0].read_bytes()).hexdigest(); assert actual=='8239d8170264ae1612bcee06561ecdc53621c5017d979eaaf35d899dd12de44d',actual; print('PINNED_PUBLIC_WHEEL_SHA256_PASS',actual)"
      - if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-public-pinned-ezdwg-wheel-linux
          path: public-reader-wheel/*.whl
          if-no-files-found: error
          retention-days: 3
      - name: Decode external AC1015, strict convert, run StructuralPro CAD engine
        run: python -m scripts.phase8_p2_ezdwg_strict_probe --output p8p2-ezdwg-strict-public-dwg-evidence.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-ezdwg-strict-public-evidence-${{ matrix.os }}
          path: p8p2-ezdwg-strict-public-dwg-evidence.json
          if-no-files-found: warn
          retention-days: 14
