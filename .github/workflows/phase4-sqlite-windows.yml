name: Phase 4 SQLite native Windows safety

on:
  push:
    branches:
      - feature/phase4-priorities4-6-site-operations-20261024
    paths:
      - .github/workflows/phase4-sqlite-windows.yml
      - core/projects/store.py
      - core/recovery/recovery.py
      - core/platform/**
      - tests/test_phase4_sqlite_dbmoved_safety.py
      - tests/test_phase4_sqlite_windows_native.py
      - tests/test_phase4_sqlite_backup_snapshot_pin.py
      - tests/test_phase4_sqlite_backup_during_writes.py
      - tests/test_phase4_sqlite_full_history_integrity.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sqlite:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test runner only
        run: python -m pip install "pytest>=8,<10"
      - name: Print Windows and native SQLite details
        shell: pwsh
        run: |
          python -c "import platform,sqlite3,sys; print(platform.platform()); print(sys.version); print('SQLite:',sqlite3.sqlite_version)"
      - name: Concurrent snapshots and revision integrity
        shell: pwsh
        run: |
          python -m pytest -q --maxfail=1 --junitxml=sqlite-windows-backup.xml tests/test_phase4_sqlite_backup_snapshot_pin.py tests/test_phase4_sqlite_backup_during_writes.py tests/test_phase4_sqlite_full_history_integrity.py
      # POSIX DBMOVED rename tests cannot be transplanted unchanged: Windows
      # denies rename of a live SQLite handle (WinError 32), verified in run 40173196953.
      - name: Native Windows file sharing and verified persistence
        shell: pwsh
        run: |
          python -m pytest -q --maxfail=1 --junitxml=sqlite-windows-native.xml tests/test_phase4_sqlite_windows_native.py
      - name: Preserve machine-readable test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqlite-windows-evidence
          path: sqlite-windows-*.xml
          if-no-files-found: warn
          retention-days: 14
