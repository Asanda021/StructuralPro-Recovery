name: P8 P2 source-backed five-floor engineering financial integration
on:
  push:
    branches:
      - test/phase8-p2-engineering-e2e-20261031
    paths:
      - tests/test_phase8_p2_fivefloor_financial_e2e.py
      - docs/acceptance/phase8_p2/**
      - .github/workflows/phase8-p2-engineering-e2e.yml
  pull_request:
    branches:
      - audit/phase8-p1-baseline-integrity-20261031
    paths:
      - tests/test_phase8_p2_fivefloor_financial_e2e.py
      - docs/acceptance/phase8_p2/**
      - .github/workflows/phase8-p2-engineering-e2e.yml
permissions:
  contents: read
concurrency:
  group: p8-p2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-five-floor-financial-chain:
    name: Five-floor + bounded adjacent protections (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - name: Prevent CRLF changes in immutable Git evidence
        run: git config --global core.autocrlf false
      - name: Checkout exact branch commit (no merge or write)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show pinned source commit
        run: git rev-parse HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux real Qt renderer dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install source repository test dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Run independently calculated golden and existing persisted source barriers
        run: >-
          python -m pytest -q -o faulthandler_timeout=0 --junitxml=p8-p2-e2e.xml
          tests/test_phase8_p2_fivefloor_financial_e2e.py
          tests/test_phase7_p2_multifloor_bundle.py
          tests/test_phase7_p2_persisted_boq_crosswalk.py
          tests/test_phase7_p4_approved_price_impact.py
          tests/test_phase7_p5_real_commit_integration.py
          tests/test_phase7_p5_ifc_boq_commit_gate.py
      - name: Keep native JUnit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8-p2-junit-${{ matrix.os }}
          path: p8-p2-e2e.xml
          retention-days: 14
          if-no-files-found: warn
