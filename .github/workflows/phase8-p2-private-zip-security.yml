name: P8 P2 user original-shaped ZIP to CAD reconciliation security gate
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - core/drawings/legacy_metre_cad_package.py
      - core/platform/application.py
      - tests/test_phase8_p2_private_metre_zip_gate.py
      - .github/workflows/phase8-p2-private-zip-security.yml
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - core/drawings/legacy_metre_cad_package.py
      - core/platform/application.py
      - tests/test_phase8_p2_private_metre_zip_gate.py
      - .github/workflows/phase8-p2-private-zip-security.yml
permissions:
  contents: read
concurrency:
  group: phase8p2-userzip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-zip-boundary-synthetic-structure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pytest -q tests/test_phase8_p2_private_metre_zip_gate.py tests/test_phase8_p2_legacy_metre_cad_reconciliation.py --junitxml=phase8-p2-private-zip.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-private-zip-gate-${{ matrix.os }}
          path: phase8-p2-private-zip.xml
          if-no-files-found: warn
          retention-days: 14
