name: P8 P2 real external DXF to reviewed SQLite BOQ (source-pinned)
on:
  push:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - scripts/phase8_p2_external_dxf_to_boq_e2e.py
      - .github/workflows/phase8-p2-external-dxf-to-boq.yml
  pull_request:
    branches: [audit/phase8-p1-baseline-integrity-20261031]
    paths:
      - scripts/phase8_p2_external_dxf_to_boq_e2e.py
      - .github/workflows/phase8-p2-external-dxf-to-boq.yml
permissions:
  contents: read
concurrency:
  group: p8-p2-external-dxf-boq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-external-dxf-review-and-boq:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install product QA dependencies (no binary compile)
        run: python -m pip install -q -r requirements.txt psutil
      - name: Execute pinned external DXF through existing review / SQLite / BOQ APIs
        run: python -m scripts.phase8_p2_external_dxf_to_boq_e2e --output p8p2-external-dxf-reviewed-boq.json
      - name: Upload limited QA proof even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-external-dxf-reviewed-boq-${{ matrix.os }}
          path: p8p2-external-dxf-reviewed-boq.json
          if-no-files-found: warn
          retention-days: 14
