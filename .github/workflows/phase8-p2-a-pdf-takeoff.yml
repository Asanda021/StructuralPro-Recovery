name: P8 P2 A PDF takeoff and reviewed BOQ

on:
  pull_request:
    branches: [test/phase8-p2-engineering-e2e-20261031]
    paths:
      - .github/workflows/phase8-p2-a-pdf-takeoff.yml
      - tests/test_phase8_p2_a_pdf_integrity.py
      - tests/test_phase8_p2_a_pdf_excel_crosswalk.py
      - tests/test_phase8_p2_a_pdf_auto_intake.py
      - tests/test_phase8_p2_a_pdf_sheet_detail_inventory.py
      - core/drawings/pdf_detail_object_index.py
      - core/drawings/pdf_vector_detail_groups.py
      - core/drawings/pdf_detail_evidence_links.py
      - tests/test_phase8_p2_a_pdf_detail_evidence_links.py
      - tests/test_phase8_p2_a_pdf_vector_detail_groups.py
      - tests/test_phase8_p2_a_pdf_detail_object_index.py
      - tests/test_phase8_p2_a_pdf_detail_object_integration.py
      - tests/test_phase8_p2_a_pdf_sheet_detail_intake_integration.py
      - core/drawings/pdf_sheet_detail_inventory.py
      - tests/test_phase8_p2_a_pdf_column_position_ledger.py
      - core/drawings/pdf_column_position_ledger.py
      - tests/test_phase8_p2_a_pdf_grid_instances.py
      - tests/test_phase8_p2_a_pdf_vector_symbol_witness.py
      - tests/test_phase8_p2_a_pdf_vector_type_labels.py
      - tests/test_phase8_p2_a_pdf_sheet_scope_registration.py
      - tests/test_phase8_p2_a_pdf_column_profile_reconcile.py
      - core/drawings/pdf_column_profile_reconcile.py
      - core/drawings/pdf_sheet_scope_registration.py
      - core/drawings/pdf_vector_type_labels.py
      - core/drawings/pdf_vector_symbol_witness.py
      - core/drawings/pdf_grid_instances.py
      - tests/test_phase8_p2_a_pdf_auto_intake_qt.py
      - tests/test_phase8_p2_a_pdf_auto_questions.py
      - core/drawings/pdf_auto_questions.py
      - core/drawings/pdf_excel_crosswalk.py
      - core/drawings/pdf_auto_intake.py
      - app/pdf_auto_intake_review.py
      - app/graphical_takeoff.py

permissions:
  contents: read

jobs:
  pdf-evidence:
    name: PDF ${{ matrix.scope }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [targeted, regression]
        os: [ubuntu-24.04, windows-2022]
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    env:
      PDF_TEST_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONPATH: .
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - name: Preserve Git evidence line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify tested source SHA
        run: >-
          python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip();
          print(actual); assert actual == os.environ['PDF_TEST_SHA']"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install runtime and test dependencies
        run: python -m pip install -q -r requirements.txt "pytest==8.4.2"
      - name: PDF source, geometry, reviewed BOQ and Qt
        if: matrix.scope == 'targeted'
        run: >-
          python -m pytest -q --junitxml=p8-p2-a.xml
          tests/test_phase8_p2_a_pdf_integrity.py
          tests/test_phase8_p2_a_pdf_excel_crosswalk.py
          tests/test_phase8_p2_a_pdf_auto_intake.py
          tests/test_phase8_p2_a_pdf_sheet_detail_inventory.py
          tests/test_phase8_p2_a_pdf_detail_object_index.py
          tests/test_phase8_p2_a_pdf_vector_detail_groups.py
          tests/test_phase8_p2_a_pdf_detail_evidence_links.py
          tests/test_phase8_p2_a_pdf_detail_object_integration.py
          tests/test_phase8_p2_a_pdf_sheet_detail_intake_integration.py
          tests/test_phase8_p2_a_pdf_column_position_ledger.py
          tests/test_phase8_p2_a_pdf_grid_instances.py
          tests/test_phase8_p2_a_pdf_vector_symbol_witness.py
          tests/test_phase8_p2_a_pdf_vector_type_labels.py
          tests/test_phase8_p2_a_pdf_sheet_scope_registration.py
          tests/test_phase8_p2_a_pdf_column_profile_reconcile.py
          tests/test_phase8_p2_a_pdf_auto_intake_qt.py
          tests/test_phase8_p2_a_pdf_auto_questions.py
          tests/test_pdf_dimension_text_regression.py
          tests/test_work_pdf_precision.py
          tests/test_chat7_pdf_scale_fail_closed.py
          tests/test_phase2_pdf_navigation.py
          tests/test_phase2_pdf_roof.py
          tests/test_phase2_pdf_roof_openings.py
          tests/test_phase2_pdf_roof_ui.py
          tests/test_phase2_polygon_amendments.py
          tests/test_phase2_topology_v2_sqlite.py
          tests/test_drawing_takeoff_persistence_and_golden.py
          tests/test_phase8_p2_fivefloor_financial_e2e.py
      - name: Adjacent pricing, reports, CAS and synthetic DWG veto
        if: matrix.scope == 'regression'
        run: >-
          python -m pytest -q --junitxml=p8-p2-a.xml
          tests/test_phase8_p2_dwg_financial_veto.py
          tests/test_recovery_concurrent_takeoff.py
          tests/test_takeoff_boq_statement_integrity.py
          tests/test_phase3_five_floor_finance.py
          tests/test_ai_takeoff_persistent_approval.py
          tests/test_phase7_p2_multifloor_bundle.py
          tests/test_phase7_p2_persisted_boq_crosswalk.py
          tests/test_phase7_p3_custom_batch.py
          tests/test_phase7_p4_technical_office_revision.py
          tests/test_phase8_p2_windows_custom_batch_freshness.py
          tests/test_p231_p240_report_export_integrity.py
          tests/test_phase7_p5_source_discrepancy_gate.py
          tests/test_phase7_p5_real_commit_integration.py
      - name: Retain JUnit for this SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8-p2-a-${{ matrix.scope }}-${{ matrix.os }}
          path: p8-p2-a.xml
          retention-days: 14
          if-no-files-found: warn
