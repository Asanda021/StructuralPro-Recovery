name: Phase 6 bounded no-debugger operational checkpoints
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - scripts/diagnostics/p6_native_checkpoints.py
      - .github/workflows/phase6-native-checkpoints.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest psutil
      - name: Run unchanged original oracle in fresh process without debugger
        run: python scripts/diagnostics/p6_native_checkpoints.py --output checkpoint-${{ matrix.repetition }} --repetition ${{ matrix.repetition }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-operational-checkpoint-${{ matrix.repetition }}
          path: |
            checkpoint-${{ matrix.repetition }}/events.jsonl
            checkpoint-${{ matrix.repetition }}/last.json
            checkpoint-${{ matrix.repetition }}/summary.json
            checkpoint-${{ matrix.repetition }}/pytest.log
            checkpoint-${{ matrix.repetition }}/junit.xml
          if-no-files-found: error
