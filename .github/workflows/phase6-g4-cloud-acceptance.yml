name: P6 G4 cloud Windows 125 percent and actual runner inventory
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-g4-cloud-acceptance.yml]
permissions:
  contents: read
jobs:
  native-shell:
    strategy:
      fail-fast: false
      matrix:
        scale: ['1.25']
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      STRUCTURALPRO_P6_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      STRUCTURALPRO_P6_SCREENSHOT_DIR: native-shell-evidence/screenshots
      STRUCTURALPRO_E5_SCREENSHOTS: native-shell-evidence/docks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8"
      - name: Record observed Windows hardware and session
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-shell-evidence | Out-Null
          $record = @{
            SourceSHA = (git rev-parse HEAD)
            OS = (Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber)
            CPU = (Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors)
            GPU = @(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,CurrentHorizontalResolution,CurrentVerticalResolution)
            Session = $env:SESSIONNAME
            QtLogicalScale = $env:QT_SCALE_FACTOR
            PhysicalOwnerHardwareTested = $false
            PhysicalMonitorDpiChanged = $false
            SleepResumeTested = $false
          }
          $record | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 native-shell-evidence/observed-environment.json
      - name: Existing tests using actual native Windows backend including child shell
        run: >-
          python -m pytest -q --junitxml=native-shell-evidence/native-shell.xml
          tests/test_phase6_p1_shell.py tests/test_phase6_p1_font_diagnostics.py
          tests/test_phase6_p5_e5_docks.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-final-native-shell-${{ matrix.scale }}
          path: native-shell-evidence/
          retention-days: 14
          if-no-files-found: error
