name: P8 P2 MAP AEC class source integrity (synthetic only)
on:
  push:
    branches:
      - fix/phase8-p2-offline-converter-veto-20261104
    paths:
      - core/drawings/dwg_map_aec_vendor_triage.py
      - tests/test_p8p2_map_aec_vendor_triage.py
      - .github/workflows/phase8-p2-map-aec-vendor-identity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  class-source-integrity:
    name: Map/AEC source-class and ghost-count veto (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source-only synthetic class identity contract
        run: |
          python -m pip install -q pytest==9.0.2
          python -m pytest -q tests/test_p8p2_map_aec_vendor_triage.py
      # NO original or transformed private DWG/DXF, no product integration.
