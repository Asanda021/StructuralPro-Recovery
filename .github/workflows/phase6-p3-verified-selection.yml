name: Phase 6 P3 verified selection index first slice
on:
  push:
    branches:
      - feature/phase6-p3-verified-selection-20261026
    paths:
      - .github/workflows/phase6-p3-verified-selection.yml
      - core/drawings/verified_selection.py
      - app/verified_selection_panel.py
      - app/graphical_takeoff.py
      - core/drawings/project_selection_bridge.py
      - tests/test_phase6_p3_real_project_bridge.py
      - tests/test_phase6_p3_full_verified_boq.py
      - tests/test_phase6_p3_verified_selection.py
      - tests/test_phase6_p3_selection_panel.py
  workflow_dispatch:
concurrency:
  group: phase6-p3-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verified-identity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install required Qt offscreen libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install verified selection and IFC test runtime
        run: python -m pip install -q -r requirements.txt 'ifcopenshell>=0.8'
      - name: Prove explicit four-way selection and no invented BOQ identity
        run: |
          python -m compileall -q core/drawings/verified_selection.py core/drawings/project_selection_bridge.py app/verified_selection_panel.py app/graphical_takeoff.py
          python -m pytest -q --maxfail=1 --junitxml=phase6-p3-selection.xml tests/test_phase6_p3_verified_selection.py tests/test_phase6_p3_selection_panel.py tests/test_phase6_p3_real_project_bridge.py tests/test_phase6_p3_full_verified_boq.py tests/test_phase6_p2_real_ifc_3d.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-p3-index-${{ matrix.os }}
          path: phase6-p3-selection.xml
          retention-days: 14
          if-no-files-found: warn
