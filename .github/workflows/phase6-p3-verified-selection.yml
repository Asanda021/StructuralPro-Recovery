name: Phase 6 P3 verified selection index first slice
on:
  push:
    branches:
      - feature/phase6-p3-verified-selection-20261026
    paths:
      - .github/workflows/phase6-p3-verified-selection.yml
      - core/drawings/verified_selection.py
      - tests/test_phase6_p3_verified_selection.py
  workflow_dispatch:
concurrency:
  group: phase6-p3-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verified-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verified selection test runtime
        run: python -m pip install -q pytest
      - name: Prove explicit four-way selection and no invented BOQ identity
        run: |
          python -m compileall -q core/drawings/verified_selection.py
          python -m pytest -q --junitxml=phase6-p3-selection.xml tests/test_phase6_p3_verified_selection.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-p3-index-${{ matrix.os }}
          path: phase6-p3-selection.xml
          retention-days: 14
          if-no-files-found: warn
