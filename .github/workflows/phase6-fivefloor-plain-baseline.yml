name: P6 five-floor unprofiled three-repeat Linux Windows baseline
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths: [.github/workflows/phase6-fivefloor-plain-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-unprofiled-qt-baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 34
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: .
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - name: Preserve exact source bytes on Windows
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5fb5c69cec5751bbbecf7018c843c5e921128bb2
          persist-credentials: false
      - name: Verify exact original test and independent runner source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5fb5c69cec5751bbbecf7018c843c5e921128bb2"
          git diff --exit-code -- tests/test_manual_formula_fivefloor_closure.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native Qt Linux packages
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install original QA dependencies and external process sampler
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Run unprofiled original Qt oracle three times in fresh subprocesses
        run: |
          python scripts/measure_fivefloor_baseline.py --repeats 3 --timeout-seconds 480 --interval-seconds 5 --output baseline-fivefloor
      - name: Surface baseline results without conflating timeouts and success
        if: always()
        shell: bash
        run: |
          python -c "import pathlib; p=pathlib.Path('baseline-fivefloor/summary.json'); print(p.read_text(encoding='utf-8') if p.exists() else 'No baseline summary created')"
      - name: Preserve every original JUnit, stdout log and periodic journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-fivefloor-plain-baseline-${{ matrix.qpa }}
          path: baseline-fivefloor/
          if-no-files-found: warn
          retention-days: 14
