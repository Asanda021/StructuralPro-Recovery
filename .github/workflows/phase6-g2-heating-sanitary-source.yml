name: Phase 6 G2 independent sanitary v1 variant original Qt UI acceptance
on:
  push:
    branches: [feature/phase6-p5-workspace-e3-e6-20261027]
    paths:
      - .github/workflows/phase6-g2-heating-sanitary-source.yml
      - scripts/diagnostics/p6_g2_heating_sanitary_original_ui.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-extra-source-qt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qpa: offscreen
          - os: windows-2022
            qpa: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONPATH: .
    steps:
      - name: Preserve tracked original bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prevent stale source or revoked verified IFC adapters
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:core/drawings/bim_adapter.py)" = "48462b5e3689b2158f9565372d93a3603b15cea0"
          test "$(git rev-parse HEAD:tests/test_manual_formula_fivefloor_closure.py)" = "f81c979051bcbaaf00015fa411314e28f370b291"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native Qt runtime on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install product and BIM original geometry dependencies
        run: python -m pip install -q -r requirements.txt "ifcopenshell>=0.8" psutil
      - name: Validate sources and script compile
        run: python -m py_compile scripts/diagnostics/p6_g2_heating_sanitary_original_ui.py scripts/diagnostics/p6_independent_ifc_public_reference.py app/graphical_takeoff.py
      - name: Probe separate pinned original sanitary v1 through actual file picker and Qt
        run: python scripts/diagnostics/p6_g2_heating_sanitary_original_ui.py --only sanitary_v1 --output p6-g2-heating-sanitary-evidence
      - name: Preserve aggregate source-backed JSON after PASS or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-g2-pinned-heating-sanitary-${{ matrix.os }}
          path: p6-g2-heating-sanitary-evidence/summary.json
          if-no-files-found: warn
          retention-days: 14
