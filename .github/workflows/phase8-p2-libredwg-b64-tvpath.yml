# Public source only. Never upload private DWG, trace, source hashes or handles.
name: P8 P2 pinned LibreDWG FileDepList TV/bit64 return-site diagnostic
on:
  push:
    branches:
      - fix/phase8-p2-offline-converter-veto-20261104
    paths:
      - tools/p8p2_instrument_b64_tvpath.py
      - tools/p8p2_instrument_b64_stage.py
      - tools/p8p2_instrument_b64_field_oracle.py
      - core/drawings/libredwg_native_trace_runner.py
      - tests/test_phase8_p2_b64_stage_instrumentation.py
      - tests/test_phase8_p2_b64_tvpath.py
      - .github/workflows/phase8-p2-libredwg-b64-tvpath.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-instrumentation:
    name: Source-pinned TV versus preflight and exact return-site tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic safe-instrumentation tests
        run: |
          python -m pip install -q pytest==9.0.2
          python -m pytest -q tests/test_phase8_p2_b64_stage_instrumentation.py tests/test_phase8_p2_b64_field_oracle.py tests/test_phase8_p2_b64_tvpath.py

  compile-public-only:
    name: Build TV/bit64 return-site diagnostic (Ubuntu, nonproduction)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBREDWG_COMMIT: a83575825b86528bf1997484852b2a9f5cdbbac0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install public GNU build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake autopoint gettext libtool libtool-bin pkg-config texinfo make gcc zlib1g-dev libxml2-dev libpcre2-dev
      - name: Checkout exact public GNU LibreDWG source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/LibreDWG/libredwg.git "$RUNNER_TEMP/libredwg-b64"
          git -C "$RUNNER_TEMP/libredwg-b64" fetch --depth=1 origin "$LIBREDWG_COMMIT"
          git -C "$RUNNER_TEMP/libredwg-b64" checkout --detach "$LIBREDWG_COMMIT"
          test "$(git -C "$RUNNER_TEMP/libredwg-b64" rev-parse HEAD)" = "$LIBREDWG_COMMIT"
          git -C "$RUNNER_TEMP/libredwg-b64" submodule update --init --recursive
      - name: Apply bounded source-only b64 stage probes + isolated 100k guard
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.p8p2_instrument_b64_tvpath "$RUNNER_TEMP/libredwg-b64"
          git -C "$RUNNER_TEMP/libredwg-b64" diff --check
          test "$(git -C "$RUNNER_TEMP/libredwg-b64" diff --name-only | wc -l)" -eq 3
          git -C "$RUNNER_TEMP/libredwg-b64" diff > "$RUNNER_TEMP/EXPERIMENTAL_B64_TVPATH_ONLY.patch"
          # Source-level provenance: reject a mislabeled older field-only build.
          grep -Fq 'SP_P8P2_FDL_TV_NULL' "$RUNNER_TEMP/EXPERIMENTAL_B64_TVPATH_ONLY.patch"
          grep -Fq 'SP_P8P2_FDL_PREFLIGHT_REJECT' "$RUNNER_TEMP/EXPERIMENTAL_B64_TVPATH_ONLY.patch"
          grep -Fq 'SP_P8P2_B64_OBJECT_SITE' "$RUNNER_TEMP/EXPERIMENTAL_B64_TVPATH_ONLY.patch"

      - name: Build diagnostic only, no private data files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/libredwg-b64"
          ./autogen.sh
          ./configure --enable-trace --disable-bindings --disable-docs --prefix="$RUNNER_TEMP/p8p2-b64-install"
          make -j2
          make install
      - name: Package exact linked native C API and public-only provenance
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p8p2-b64-tvpath-public"
          mkdir -p "$out/lib"
          pc=$(find "$RUNNER_TEMP/p8p2-b64-install" -name libredwg.pc -type f | head -1)
          test -n "$pc"
          export PKG_CONFIG_PATH="$(dirname "$pc")"
          cc -O2 -DSTRUCTURALPRO_LIBREDWG_COMMIT='"a835758-exp100k-b64tvpath"' \
             tools/structuralpro_libredwg_capi_probe.c \
             $(pkg-config --cflags --libs libredwg) \
             -Wl,-rpath,'$ORIGIN/lib' -o "$out/structuralpro_libredwg_capi_probe"
          real=$(find "$RUNNER_TEMP/p8p2-b64-install" -type f -name 'libredwg.so.*' | head -1)
          test -n "$real"
          soname=$(readelf -d "$out/structuralpro_libredwg_capi_probe" | grep 'Shared library:' | grep -o 'libredwg.so[^]]*' | head -1)
          test -n "$soname"
          cp "$real" "$out/lib/$soname"
          cp "$RUNNER_TEMP/EXPERIMENTAL_B64_TVPATH_ONLY.patch" "$out/EXPERIMENTAL_B64_TVPATH_ONLY.patch"
          cp "$RUNNER_TEMP/libredwg-b64/COPYING" "$out/LIBREDWG_GPL_LICENSE.txt"
          printf '%s\n' "$LIBREDWG_COMMIT" > "$out/LIBREDWG_UPSTREAM_COMMIT.txt"
          printf '%s\n' 'DO NOT RELEASE: public source instrumentation only; b64 diagnostic; financial veto persists' > "$out/NOT_FOR_RELEASE.txt"
          (cd "$out" && sha256sum structuralpro_libredwg_capi_probe "lib/$soname" EXPERIMENTAL_B64_TVPATH_ONLY.patch > PUBLIC_BINARY_SHA256.txt)
          (cd "$out" && ldd structuralpro_libredwg_capi_probe)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8p2-public-b64-tvpath-diagnostic-only-${{ github.sha }}
          path: ${{ runner.temp }}/p8p2-b64-tvpath-public/
          if-no-files-found: error
          retention-days: 7
