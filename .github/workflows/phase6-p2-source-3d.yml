name: Phase 6 P2 verified IFC 3D viewport and identity tests
on:
  push:
    branches:
      - feature/phase6-p2-source-backed-3d-20261026
    paths:
      - .github/workflows/phase6-p2-source-3d.yml
      - core/drawings/source_mesh3d.py
      - app/ifc_3d_viewport.py
      - app/graphical_takeoff.py
      - app/main.py
      - tests/test_phase6_p1_shell.py
      - tests/test_phase6_p2_source_mesh3d.py
      - tests/test_phase6_p2_real_ifc_3d.py
  workflow_dispatch:
concurrency:
  group: phase6-p2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt and real IFC adapter
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libgl1 libxcb-cursor0
          python -m pip install -q -r requirements.txt 'ifcopenshell>=0.8'
      - name: Verify 3D source provenance, camera, selection and Qt 2D integration
        run: |
          python -m compileall -q core/drawings/source_mesh3d.py app/ifc_3d_viewport.py app/graphical_takeoff.py
          python scripts/run_offline_tests.py -q --maxfail=1 --junitxml=phase6-p2-linux.xml \
            tests/test_phase6_p2_source_mesh3d.py \
            tests/test_phase6_p2_real_ifc_3d.py \
            tests/test_ifc_mesh_viewer.py \\
            tests/test_phase6_p1_shell.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-p2-linux-evidence
          path: phase6-p2-linux.xml
          retention-days: 14
          if-no-files-found: warn
  windows-3d:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      STRUCTURALPRO_P6_P2_SCREENSHOT_DIR: phase6-p2-evidence/windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt and real IFC adapter
        shell: pwsh
        run: python -m pip install -q -r requirements.txt 'ifcopenshell>=0.8'
      - name: Verify native Windows 3D scene and controls
        shell: pwsh
        run: |
          python -m compileall -q core/drawings/source_mesh3d.py app/ifc_3d_viewport.py app/graphical_takeoff.py
          python -m pytest -q --maxfail=1 --junitxml=phase6-p2-windows.xml tests/test_phase6_p2_source_mesh3d.py tests/test_phase6_p2_real_ifc_3d.py tests/test_ifc_mesh_viewer.py tests/test_phase6_p1_shell.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-p2-windows-evidence
          path: |
            phase6-p2-windows.xml
            phase6-p2-evidence/windows/
          retention-days: 14
          if-no-files-found: warn
