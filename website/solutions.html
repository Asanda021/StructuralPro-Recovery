<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StructuralPro Solutions by Role</title><style>:root{--bg:#071222;--s:#0d1828;--t:#f5f7fa;--m:#8c9aaf;--b:#2e3b4d;--a:#00d4f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 Inter,"Segoe UI",sans-serif}.wrap{width:min(calc(100% - 40px),1280px);margin:auto}header{padding:68px 0 40px;border-bottom:1px solid var(--b)}.ey{color:var(--a);font-size:13px;font-weight:700;letter-spacing:.1em}h1{font-size:clamp(40px,5vw,64px);line-height:1.05;margin:12px 0}.lead{color:var(--m);max-width:800px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:42px 0}.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:22px;min-height:245px}.role{color:var(--a);font-size:12px;font-weight:700;text-transform:uppercase}.card h2{font-size:21px;margin:9px 0}.card p{color:var(--m)}ul{padding-left:18px}.cta{display:inline-block;margin-top:12px;color:var(--a);text-decoration:none;font-weight:700}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:580px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div class="ey">SOLUTIONS BY ROLE</div><h1>One AEC Ecosystem. Your Workflow.</h1><p class="lead">Start with your role and discover the connected StructuralPro products that support the work around you. The catalog routes by outcome, not by a wall of 30 products.</p></div></header><main class="wrap"><div class="grid" id="grid"></div></main><script>const roles=[["quantity-surveyor","Quantity Surveyor / Estimator",["takeoff","boq","estimating"],"Measure faster, structure quantities, build BOQs and estimates."],["technical-office","Technical Office",["technical-office","boq","estimating","reports-intelligence"],"Connect technical documentation, quantities, estimates and reporting."],["site-supervisor","Site Supervisor",["site-supervisor","reports-intelligence"],"Keep site information, progress and documents connected."],["project-controller","Project Controller",["project-controls","cost-control","reports-intelligence"],"Track progress, cost, commitments and project signals."],["project-manager","Project Manager",["project-manager","cost-control","project-controls","reports-intelligence"],"Bring schedule, cost, progress and reporting into one project view."],["bim-manager","BIM Manager",["bim-takeoff","bim-coordination","ai-assistant"],"Connect models, coordination, quantities and project intelligence."],["structural-engineer","Structural Engineer",["structural-analysis-design","concrete-engineering","steel-engineering","masonry-engineering"],"Route structural work across specialized engineering products."],["architect","Architect",["architecture","bim-coordination"],"Connect architectural workflows with BIM coordination."],["mep-engineer","MEP Engineer",["mep","bim-coordination"],"Coordinate MEP work with the wider project model."],["geotechnical-engineer","Geotechnical Engineer",["geotechnical","civil-site"],"Connect ground engineering with site and project workflows."],["contract-commercial","Contract / Commercial Team",["contract-claims","procurement","cost-control"],"Connect claims, procurement and commercial cost workflows."],["enterprise","Enterprise",["aec-enterprise"],"Govern products, teams, projects and connected AEC workflows."]];const products=[{"id":"takeoff","name":"StructuralPro Takeoff"},{"id":"cad-takeoff","name":"StructuralPro CAD Takeoff"},{"id":"bim-takeoff","name":"StructuralPro BIM Takeoff"},{"id":"boq","name":"StructuralPro BOQ"},{"id":"estimating","name":"StructuralPro Estimating"},{"id":"technical-office","name":"StructuralPro Technical Office"},{"id":"site-supervisor","name":"StructuralPro Site Supervisor"},{"id":"project-controls","name":"StructuralPro Project Controls"},{"id":"project-manager","name":"StructuralPro Project Manager"},{"id":"cost-control","name":"StructuralPro Cost Control"},{"id":"contract-claims","name":"StructuralPro Contract & Claims"},{"id":"procurement","name":"StructuralPro Procurement"},{"id":"bim-coordination","name":"StructuralPro BIM & Coordination"},{"id":"ai-assistant","name":"StructuralPro AI & AEC Assistant"},{"id":"reports-intelligence","name":"StructuralPro Reports & Intelligence"},{"id":"price-cost-intelligence","name":"StructuralPro Price & Cost Intelligence"},{"id":"structural-analysis-design","name":"StructuralPro Structural Analysis & Design"},{"id":"geotechnical","name":"StructuralPro Geotechnical"},{"id":"architecture","name":"StructuralPro Architecture"},{"id":"mep","name":"StructuralPro MEP"},{"id":"civil-site","name":"StructuralPro Civil & Site"},{"id":"concrete-engineering","name":"StructuralPro Concrete Engineering"},{"id":"steel-engineering","name":"StructuralPro Steel Engineering"},{"id":"masonry-engineering","name":"StructuralPro Masonry Engineering"},{"id":"timber-engineering","name":"StructuralPro Timber Engineering"},{"id":"composite-structures","name":"StructuralPro Composite Structures"},{"id":"precast","name":"StructuralPro Precast"},{"id":"special-structures","name":"StructuralPro Special Structures"},{"id":"aec-enterprise","name":"StructuralPro AEC Enterprise","platform":true}];const byId=Object.fromEntries(products.map(p=>[p.id,p.name]));document.getElementById("grid").innerHTML=roles.map(r=>"<article class='card'><div class='role'>"+r[1]+"</div><h2>"+r[1]+"</h2><p>"+r[3]+"</p><ul>"+r[2].map(id=>"<li>"+byId[id]+"</li>").join("")+"</ul><a class='cta' href='products.html'>Explore solution →</a></article>").join("");</script></body></html>
