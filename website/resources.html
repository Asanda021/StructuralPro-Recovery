<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StructuralPro Resources</title><style>body{margin:0;background:#071222;color:#f5f7fa;font:16px/1.6 "Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 20px}.hero{padding:70px 20px}.ey{color:#00d4f5;font-weight:800}.lead{color:#8c9aaf}.note,.card,.filter{border:1px solid #2e3b4d;background:#0d1828;border-radius:14px}.note{padding:16px;color:#8c9aaf}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter{color:#f5f7fa;padding:9px 13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:30px 0 80px}.card{padding:22px;min-height:220px;display:flex;flex-direction:column}.meta{display:flex;justify-content:space-between;color:#8c9aaf;font-size:12px}.available{color:#00d4f5}.planned{color:#b8c2d0}.card h2{font-size:21px}.card p{color:#8c9aaf}.footer{margin-top:auto}.link{display:inline-flex;border:1px solid #2e3b4d;padding:8px 11px;border-radius:9px}[dir=rtl] body{font-family:Tahoma,sans-serif}[dir=rtl] .hero{text-align:right}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="wrap"><button id="lang">فارسی</button></header><main class="wrap"><section class="hero"><div class="ey">RESOURCES</div><h1 id="title">Resources for the AEC workflow.</h1><p class="lead" id="lead"></p><div class="note" id="principle"></div></section><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main><script>const fa=new URLSearchParams(location.search).get("lang")==="fa";const lang=fa?"fa":"en";document.documentElement.lang=lang;document.documentElement.dir=fa?"rtl":"ltr";document.getElementById("lang").onclick=()=>location.href=fa?"resources.html":"resources.html?lang=fa";const c={en:{t:"Resources for the AEC workflow.",l:"Documentation, operational guidance and validated knowledge.",a:"All",v:"Available",p:"Planned",o:"Open resource",f:"Planned content"},fa:{t:"منابع برای گردش‌کار AEC",l:"مستندات، راهنمای عملیاتی و دانش اعتبارسنجی‌شده.",a:"همه",v:"موجود",p:"در برنامه",o:"باز کردن منبع",f:"محتوای در برنامه"}}[lang];title.textContent=c.t;lead.textContent=c.l;fetch("data/resources.json").then(r=>r.json()).then(d=>{principle.textContent=d.principle[lang];const ts=["All",...new Set(d.items.map(x=>x.type))];let active="All";ts.forEach(t=>{let b=document.createElement("button");b.className="filter";b.textContent=t=="All"?c.a:t;b.onclick=()=>{active=t;render()};filters.append(b)});function render(){grid.innerHTML="";d.items.filter(x=>active=="All"||x.type==active).forEach(i=>{let s=i.status=="Available"?c.v:c.p;let a=i.href?'<a class="link" href="'+i.href+'">'+c.o+' →</a>':'<span class="link">'+c.f+"</span>";let e=document.createElement("article");e.className="card";e.innerHTML='<div class="meta"><span>'+i.type+'</span><span class="'+i.status.toLowerCase()+'">'+s+'</span></div><h2>'+i.title[lang]+'</h2><p>'+i.description[lang]+'</p><div class="footer">'+a+"</div>";grid.append(e)})}render()});</script></body></html>
